  const clean = vals.filter((v) => Number.isFinite(v) && v >= 0 && v <= n);
  return clean.length ? new Set(clean) : null;
};


/* ================================================================== *
 * Win95 bevel primitives

const C = {
  face: '#c0c0c0',
  light: '#ffffff',
  shadow: '#808080',
  dark: '#000000',
  blue: '#000080',
  text: '#000000',
};
// raised bevel (buttons, panels)
const RAISED = {
  borderTop: `2px solid ${C.light}`,
  borderLeft: `2px solid ${C.light}`,

};

const SUNKEN = {
  borderTop: `2px solid ${C.shadow}`,
  borderLeft: `2px solid ${C.shadow}`,
  borderRight: `2px solid ${C.light}`,
  borderBottom: `2px solid ${C.light}`,
  boxShadow: `inset 1px 1px 0 ${C.dark}, inset -1px -1px 0 ${C.face}`,
};
// pressed button
const PRESSED = {
  borderTop: `2px solid ${C.dark}`,
  borderLeft: `2px solid ${C.dark}`,
  borderRight: `2px solid ${C.light}`,
  borderBottom: `2px solid ${C.light}`,

};

const DOS_FONT = `'MS Sans Serif', 'Pixelated MS Sans Serif', Tahoma, Geneva, sans-serif`;

/* ================================================================== *
 * Win95 primitive components  (module scope: stable identity, so inputs
 * keep focus and sliders keep their drag across re-renders)
 * ================================================================== */

const Btn = ({ children, onClick, active, disabled, style, title, full }) => {
  const [down, setDown] = useState(false);
  const bevel = (down || active) ? PRESSED : RAISED;
  return (
    <button
      title={title}
      disabled={disabled}
      onMouseDown={() => setDown(true)}
      onMouseUp={() => setDown(false)}
      onMouseLeave={() => setDown(false)}
      onClick={onClick}
      style={{ ...bevel, background: C.face, ...(style || {}) }}
      className={`${full ? 'w-full ' : ''}px-2 py-1 text-[11px] leading-none text-black select-none
        disabled:opacity-50 disabled:cursor-default active:outline-none
        ${(down || active) ? 'pt-[5px] pb-[3px] pl-[9px] pr-[7px]' : ''}`}
    >
      {children}
    </button>
  );
};

const Group = ({ label, children, style }) => (
  <fieldset
    style={{ ...SUNKEN, background: C.face, ...(style || {}) }}
    className="relative px-2 pt-3 pb-2 mt-2"
  >
    <legend className="px-1 text-[11px] text-black -ml-0.5">{label}</legend>
    {children}
  </fieldset>
);

const Readout = ({ label, value, color = '#39ff5a', wide }) => (
  <div className="flex items-center gap-1.5">
    {label && <span className="text-[11px] text-black whitespace-nowrap">{label}</span>}
    <div style={{ ...SUNKEN, background: '#000' }}
      className={`px-1.5 py-0.5 font-mono text-right ${wide ? 'min-w-[5rem]' : 'min-w-[3rem]'}`}>
      <span style={{ color, textShadow: `0 0 4px ${color}88` }} className="text-[12px] tracking-wider">{value}</span>
    </div>
  </div>
);

// Editable phosphor field: type a number, commit on Enter or blur.
const EditReadout = ({ draft, liveValue, onDraft, onCommit, label, color = '#39ff5a', wide }) => (
  <div className="flex items-center gap-1.5">
    {label && <span className="text-[11px] text-black whitespace-nowrap">{label}</span>}
    <div style={{ ...SUNKEN, background: '#000' }}
      className={`px-1 py-0.5 ${wide ? 'min-w-[5rem]' : 'min-w-[3rem]'}`}>
      <input
        inputMode="numeric"
        value={draft !== null ? draft : liveValue}
        onChange={(e) => onDraft(e.target.value.replace(/[^0-9]/g, ''))}
        onFocus={(e) => { onDraft(String(liveValue)); e.target.select(); }}
        onBlur={onCommit}
        onKeyDown={(e) => {
          if (e.key === 'Enter') { onCommit(); e.target.blur(); }
          else if (e.key === 'Escape') { onDraft(null); e.target.blur(); }

        className="w-full bg-transparent font-mono text-[12px] tracking-wider text-right outline-none"
        style={{ color, textShadow: `0 0 4px ${color}88` }}

const Check = ({ checked, onChange, label }) => (
  <label className="flex items-center gap-1.5 cursor-pointer select-none">

const Slider = ({ min, max, step = 1, value, onChange, disabled, onMouseDown }) => (

// Collapsible slot. Animating grid-template-rows between 0fr and 1fr collapses the
// panel without needing a measured height, and reserving the row keeps the console
// from reflowing as sections open. This wrapper existed inline ~25 times.

    style={{ gridTemplateRows: when ? '1fr' : '0fr' }}>

// Grey caption under a control.
const Note = ({ children, className = '' }) => (
  <p className={`text-[10px] leading-tight ${className || 'mt-1'}`} style={{ color: '#808080' }}>
    {children}
  </p>
);

// Digit-only field. The visible range is declared once and drives both the caption and
// the input length cap, so the two cannot disagree (they were hand-matched before).
const NumField = ({ label, value, onChange, min, max, range = true, cols }) => {
  const digits = String(max === undefined ? 999 : max).length;
  const caption = max === undefined || !range ? label
    : `${label} (${min === undefined ? 0 : min}–${max})`;
  return (
    <label className={`flex flex-col gap-0.5 ${cols || ''}`}>
      <span className="text-[10px]">{caption}</span>
      <input className="w95-text" inputMode="numeric" value={value}
        onChange={(e) => onChange(e.target.value.replace(/[^0-9]/g, '').slice(0, digits))} />
    </label>
  );
};

// Literal class names, so Tailwind sees the exact strings already used elsewhere in
// the console rather than an interpolated one.
const GRID_COLS = ['', 'grid-cols-1', 'grid-cols-2', 'grid-cols-3', 'grid-cols-4'];

// Row of mutually exclusive buttons driven by a list of [value, label, title?].
const Seg = ({ label, options, value, onChange, cols }) => (
  <>
    {label && <span className="text-[10px] block mt-2">{label}</span>}
    <div className={`grid ${GRID_COLS[cols || Math.min(4, options.length)]} gap-0.5 mt-0.5`}>
      {options.map(([id, text, title]) => (
        <Btn key={id} full active={value === id} title={title} onClick={() => onChange(id)}>{text}</Btn>
      ))}
    </div>
  </>
);

/* ================================================================== *
 * Per-layer map controls
 *
 * One case per layer that has knobs; layers with nothing to configure fall through
 * and show only their registry description. This replaces ~15 hand-written collapsible
 * blocks in the console, each of which repeated the same label/input/caption scaffolding
 * and had to be kept in the right order by hand.
 * ================================================================== */
const MapControls = ({ id, P, setP, mod, colorScheme, censusN, onResetCensus, picking, onTogglePick }) => {
  const f = (key) => (v) => setP(key, v);
  switch (id) {
    case 'colorflow': return (
      <div className="grid grid-cols-2 gap-1.5 mt-2">
        <label className="flex flex-col gap-0.5">
          <span className="text-[10px]">TRACK RESIDUE</span>
          <input className="w95-text" inputMode="numeric" value={P.flowTargetValue}
            onChange={(e) => setP('flowTargetValue', e.target.value.replace(/[^0-9]/g, ''))} />
          <div className="mt-1">
            <ResidueStrip mod={mod} scheme={colorScheme} value={P.flowTargetValue}
              onPick={f('flowTargetValue')} />
          </div>
        </label>
        <NumField label="SMOOTHING" min={0} max={4} value={P.flowSmooth} onChange={f('flowSmooth')} />
      </div>
    );
    case 'stripes': return (
      <>
        <Seg label="SCAN DIRECTION" value={P.stripeDir} onChange={f('stripeDir')}
          options={[['diagL', 'DIAG ╲', 'Down the left diagonal'],
                    ['diagR', 'DIAG ╱', 'Down the right diagonal'],
                    ['row', 'ROW —', 'Across the row']]} />
        <div className="grid grid-cols-2 gap-1.5 mt-2">
          <NumField label="TOLERANCE" range={false} max={MOD_CAP} value={P.stripeTol} onChange={f('stripeTol')} />
          <NumField label="PERIOD" min={1} max={8} value={P.stripePeriod} onChange={f('stripePeriod')} />
        </div>
      </>
    );
    case 'magnify': return (
      <>
        <Seg label="AMPLIFY" value={P.magSource} onChange={f('magSource')}
          options={[['velocity', 'VELOCITY', 'Frame-to-frame change'],
                    ['deviation', 'DEVIATION', 'Deviation from the running average'],
                    ['blend', 'BLEND', 'Blend of both']]} />
        <Seg label="DISPLAY" value={P.magDisplay} onChange={f('magDisplay')}
          options={[['pure', 'PURE MOTION', 'Motion only; static cells stay neutral'],
                    ['boost', 'BOOST BASE', 'Normal colors with motion added on top']]} />
        <div className="grid grid-cols-2 gap-1.5 mt-2">
          <NumField label="WINDOW" min={2} max={64} value={P.magWindow} onChange={f('magWindow')} />
          <NumField label="AMPLIFY ×" range={false} max={64} value={P.magAmp} onChange={f('magAmp')} />
        </div>
      </>
    );
    case 'average': return (
      <>
        <Seg label="AVERAGING" value={P.avgMode} onChange={f('avgMode')}
          options={[['spatial', 'SPATIAL', 'Blur nearby cells within each frame'],
                    ['temporal', 'TEMPORAL', 'Average each cell over recent frames']]} />
        <div className="mt-2">
          {P.avgMode === 'temporal'
            ? <NumField label="FRAMES" min={1} max={64} value={P.avgAmount} onChange={f('avgAmount')} />
            : <NumField label="BLUR PASSES" min={1} max={12} value={P.avgAmount} onChange={f('avgAmount')} />}
        </div>
      </>
    );
    case 'bandpass': return (
      <div className="grid grid-cols-2 gap-1.5 mt-2">
        <NumField label="KEEP R" min={0} max={16} value={P.bandLo} onChange={f('bandLo')} />
        <NumField label="CUT R" min={1} max={24} value={P.bandHi} onChange={f('bandHi')} />
      </div>
    );
    case 'afterimage': return (
      <div className="grid grid-cols-3 gap-1.5 mt-2">
        <NumField label="STRENGTH %" range={false} max={100} value={P.aiStrength} onChange={f('aiStrength')} />
        <NumField label="ATTACK" range={false} max={64} value={P.aiAttack} onChange={f('aiAttack')} />
        <NumField label="DECAY" range={false} max={64} value={P.aiDecay} onChange={f('aiDecay')} />
      </div>
    );
    case 'lagdiff': return (
      <>
        <Seg label="LAG DIRECTION" value={P.lagDir} onChange={f('lagDir')}
          options={[['diagL', 'DIAG ╲', 'Down the left diagonal'],
                    ['diagR', 'DIAG ╱', 'Down the right diagonal'],
                    ['row', 'ROW —', 'Across the row']]} />
        <div className="mt-2">
          <NumField label="LAG" min={1} max={128} value={P.lagLen} onChange={f('lagLen')} />
        </div>
      </>
    );
    case 'primes': return (
      <Seg value={P.primesMode} onChange={f('primesMode')}
        options={[['spectrum', 'SPECTRUM', 'Each prime residue gets its index among all primes'],
                  ['mask', 'MASK', 'Binary prime indicator — multiply-blend to restrict other maps to primes']]} />
    );
    case 'lucas': return (
      <div className="mt-2">
        <NumField label="SCALE (0 = FINEST)" range={false} max={12} value={P.lucasScale} onChange={f('lucasScale')} />
      </div>
    );
    case 'density': return (
      <div className="mt-2"><NumField label="RADIUS" min={1} max={16} value={P.densityR} onChange={f('densityR')} /></div>
    );
    case 'moire': return (
      <div className="mt-2"><NumField label="RADIUS" min={1} max={16} value={P.moireR} onChange={f('moireR')} /></div>
    );
    case 'variance': return (
      <div className="mt-2"><NumField label="RADIUS" min={1} max={16} value={P.varR} onChange={f('varR')} /></div>
    );
    case 'padic': return (
      <div className="mt-2"><NumField label="DIGIT" min={0} max={12} value={P.padicDigit} onChange={f('padicDigit')} /></div>
    );
    case 'census': return (
      <div className="flex items-center gap-1.5 mt-2">
        <Btn onClick={onResetCensus} title="Clear the accumulated census">RESET</Btn>
        <span className="text-[10px]" style={{ color: '#808080' }}>SAMPLED: {censusN} MODS</span>
      </div>
    );
    case 'trail': return (
      <>
        <div className="grid grid-cols-3 gap-1.5 mt-2">
          <label className="flex flex-col gap-0.5">
            <span className="text-[10px]">TARGET (0–999)</span>
            <input className="w95-text" value={P.trailTarget}
              onChange={(e) => setP('trailTarget', e.target.value.toLowerCase().replace(/[^0-9a-z]/g, '').slice(0, 6))} />
          </label>
          <NumField label="BLEED" min={1} max={500} value={P.trailWidth} onChange={f('trailWidth')} />
          <NumField label="TRAIL" min={1} max={64} value={P.trailLen} onChange={f('trailLen')} />
        </div>
        <div className="mt-1.5">
          <ResidueStrip spectral mod={mod} scheme={colorScheme} value={P.trailTarget}
            bleed={P.trailWidth} onPick={f('trailTarget')} />
        </div>
        <div className="mt-1">
          <Btn full active={picking} onClick={onTogglePick}
            title="Then click any cell in the triangle (2D view) to take its color">⊕ PICK FROM TRIANGLE</Btn>
        </div>
        <Note>
          The strip is a CONSTANT wheel — the same rainbow at every modulus, so the target keeps meaning one color while the sweep restretches residues. Left swatches: void and white (strict, no bleed). BLEED is a window on the wheel (thousandths; it wraps, so red bleeds toward orange AND violet) — whichever residues fall inside it at the current mod match, including values that do not exist yet at smaller mods. PICK grabs a 2D cell's wheel position.
        </Note>
      </>
    );
    default: return null;
  }
};

// One active layer's block: its name, its knobs, its description.
const MapPanel = ({ mm, ...rest }) => (
  <div className="mt-2 pt-1.5" style={{ borderTop: `1px dotted ${C.shadow}` }}>
    <span className="text-[10px] font-bold">
      {mm.label}{mm.sweep ? ' ↻' : ''}
      {mm.kind === 'transform' && <span style={{ color: '#808080' }}> · TRANSFORM</span>}
    </span>
    <MapControls id={mm.id} {...rest} />
    <Note>{typeof mm.desc === 'function' ? mm.desc(rest.P) : mm.desc}</Note>
  </div>
);

/* ================================================================== */

function App() {
  const [size, setSize] = useState(128);
  const [mod, setMod] = useState(5);
  const [isPaired, setIsPaired] = useState(false);
  const [linkCap, setLinkCap] = useState('500'); // max rows used when LINKED (mod can far exceed sane row counts)
  const [rowStartInput, setRowStartInput] = useState('0'); // draw the window starting at this row (offset into the triangle)
  const [halfMode, setHalfMode] = useState('full'); // 'full' | 'left' | 'right' — focus one mirror half
  const [halfLayout, setHalfLayout] = useState('equi');  // 'equi' (centered equilateral) | 'shape' (original positions)
  const [viewMode, setViewMode] = useState('2d');        // '2d' flat | 'relief' isometric height field
  const [zScale3d, setZScale3d] = useState('40');        // 3D peak height, in cell-row units
  const [meshStep, setMeshStep] = useState('0');         // lattice mesh step; 0 = auto (~300 mesh rows)
  const [tweenMs, setTweenMs] = useState('0');           // sweep transition duration; 0 = hard cuts
  const [tweenTick, setTweenTick] = useState(0);         // rAF pump for field morphing
  const [mapColorMode, setMapColorMode] = useState('math'); // field display: 'math' scheme ramp | 'palette' tint
  const [trailPicking, setTrailPicking] = useState(false); // TRAIL eyedropper: next 2D cell click sets TARGET
  const [colorScheme, setColorScheme] = useState('rainbow');
  const [activeMaps, setActiveMaps] = useState(() => new Set(['value'])); // checked map layers
  const [blendMode, setBlendMode] = useState('average'); // average | multiply | max | screen
  const toggleMap = (id) => setActiveMaps((prev) => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    if (next.size === 0) next.add('value'); // never fully empty
    return next;
  });

  // ---- Map parameters, in ONE object ----
  // Every knob belonging to a map layer lives here. The field pipeline already takes
  // them as a single `P` bag, and they were previously 27 separate useState hooks that
  // had to be re-listed in three identical object literals (live field, palette planes,
  // export context) and in two long dependency arrays. Keeping them together means a
  // new map parameter is added in exactly one place, and no memo can silently go stale
  // because a dependency was forgotten.
  const [P, setPState] = useState({
    primesMode: 'spectrum',   // PRIMES: 'spectrum' (prime index) | 'mask' (binary)
    trailTarget: 'void',      // TRAIL: 'void' | 'white' | 0..999 wheel position
    trailWidth: '40',         // TRAIL: bleed half-width, thousandths of the wheel
    trailLen: '12',           // TRAIL: fade length in frames
    aiStrength: '45',         // AFTERIMAGE: ghost strength %
    aiAttack: '3',            // AFTERIMAGE: frames to build fatigue
    aiDecay: '16',            // AFTERIMAGE: frames to release it
    flowTargetValue: '1',     // COLOR FLOW: residue tracked
    flowSmooth: '1',          // COLOR FLOW: smoothing passes (0..4) -> zones
    stripeDir: 'diagL',       // STRIPES: 'diagL' | 'diagR' | 'row'
    stripeTol: '0',           // STRIPES: color tolerance band (mod-aware)
    stripePeriod: '1',        // STRIPES: run-length of each band (1=ABAB, 2=AABB...)
    magSource: 'velocity',    // MAGNIFY: 'velocity' | 'deviation' | 'blend'
    magDisplay: 'pure',       // MAGNIFY: 'pure' (motion only) | 'boost' (base + motion)
    magWindow: '6',           // MAGNIFY: history length
    magAmp: '8',              // MAGNIFY: amplification factor
    avgMode: 'spatial',       // AVERAGE: 'spatial' | 'temporal'
    avgAmount: '2',           // AVERAGE: blur passes, or frame window when temporal
    lucasScale: '0',          // LUCAS: base-p digit scale
    densityR: '4',            // DENSITY: neighborhood passes
    padicDigit: '1',          // P DIGIT: which base-p digit
    bandLo: '1',              // BAND PASS: keep radius (small blur)
    bandHi: '6',              // BAND PASS: cut radius (large blur)
    lagDir: 'diagL',          // LAG DIFF: direction
    lagLen: '1',              // LAG DIFF: distance
    moireR: '4',              // MOIRÉ: covariance radius
    varR: '4',                // VARIANCE: neighborhood radius
  });
  const setP = useCallback((key, val) => setPState((prev) => ({ ...prev, [key]: val })), []);

  const [censusN, setCensusN] = useState(0); // sampled-mod count (display mirror)
  const [censusTick, setCensusTick] = useState(0); // bumps on RESET to force recompute
  const [showNumbers, setShowNumbers] = useState(false);
  const [numberMode, setNumberMode] = useState('overlay'); // 'overlay' (on colors) | 'plain' (numbers only)

  // Modulus selection: one mode, not three cross-clearing flags. The three names the
  // rest of the console reads are derived, so every consumer stays in sync by
  // construction (see MOD_MODES).
  const [modMode, setModMode] = useState('all');
  const primeOnly = modMode === 'prime';
  const intervalOn = modMode === 'interval';
  const modParity = (modMode === 'even' || modMode === 'odd' || modMode === 'noprime') ? modMode : 'all';
  const [primeSortFilter, setPrimeSortFilter] = useState('all');
  const [intervalSeq, setIntervalSeq] = useState('fixed'); // 'fixed' | 'pi' | 'fib' | 'prime' | 'square' | 'pow2'
  const [intervalStep, setIntervalStep] = useState('3'); // step between mods when seq = fixed

  const [isolateInput, setIsolateInput] = useState('');
  // Draft text for the editable number fields (null = not being edited; show live value)
  const [modDraft, setModDraft] = useState(null);
  const [sizeDraft, setSizeDraft] = useState(null);

  const [zoom, setZoom] = useState(1.0);
  const [pan, setPan] = useState({ x: 0, y: 40 });
  const [followMod, setFollowMod] = useState(false);   // window tracks the mod-proportional anchor row
  const [followModPct, setFollowModPct] = useState('100'); // anchor = mod * pct/100 (100 = the mod line, 50 = block center)
  const [hoveredCell, setHoveredCell] = useState(null);
  const [showAnalysis, setShowAnalysis] = useState(false); // cell-analysis decal starts minimized

  const [isPlaying, setIsPlaying] = useState(false);
  const [playSpeed, setPlaySpeed] = useState(250);
  const [playDir, setPlayDir] = useState(1); // 1 forward, -1 reverse
  const [playLoop, setPlayLoop] = useState(true);
  const [keepSizeFixed, setKeepSizeFixed] = useState(true);

  // Animation export
  const [expStartMod, setExpStartMod] = useState('2');
  const [expEndMod, setExpEndMod] = useState('128');
  const [expPxPerCell, setExpPxPerCell] = useState('1');
  const [expRowMode, setExpRowMode] = useState('match'); // 'match' (mirror preview) | 'track' (rows=mod) | 'fixed'
  const [expFit, setExpFit] = useState('center'); // 'center' | 'stretch' | 'tight'
  const [expFixedRows, setExpFixedRows] = useState('128');
  const [expBusy, setExpBusy] = useState(false);
  const [expProgress, setExpProgress] = useState(0);
  const [expStatus, setExpStatus] = useState('');

  const canvasRef = useRef(null);
  const offscreenRef = useRef(null);
  const censusRef = useRef({ size: 0, sum: null, count: 0 }); // divisor-census accumulator (past frames)
  const censusLastRef = useRef(null); // last triangle recorded (guards double-counting on map toggles)
  const lastTriRef = useRef(null);      // tween: triangle of the previous frame
  const lastFieldRef = useRef(null);    // tween: true field of the previous frame
  const lastShownRef = useRef(null);    // tween: field actually displayed last render (mid-morph retarget)
  const tweenRef = useRef({ mode: null }); // tween state machine: 'morph' | 'fade' | null
  const lerpBufRef = useRef(null);      // reused morph interpolation buffer
  const prevCanvasRef = useRef(null);   // fade: snapshot of the previous offscreen
  const rafPendingRef = useRef(false);  // fade: self-pump guard
  const colorHistRef = useRef({ size: 0, frames: [] }); // PALETTE BLEND temporal AVERAGE image history
  const trailRef = useRef({ size: 0, prev: null, e: null, tri: null, key: '' }); // TRAIL accumulator (peak-hold)
  const adaptLastRef = useRef(null); // frame last folded into adaptation (param edits must not advance time)
  const adaptRef = useRef({ size: 0, s: null });          // AFTERIMAGE adaptation, scalar field
  const adaptColorRef = useRef({ size: 0, r: null, g: null, b: null }); // ... and per RGB channel
  const rectRef = useRef(null);
  const dragStart = useRef({ x: 0, y: 0 });
  const isDragging = useRef(false);
  const pickDownRef = useRef(null); // pointer-down position (click-vs-drag for the eyedropper)
  const prevTemporalRef = useRef(null); // { mod, residues:Uint array } for temporal diffing
  const motionHistRef = useRef({ size: 0, frames: [] }); // rolling residue snapshots for magnification
  const fieldHistRef = useRef({ size: 0, frames: [] }); // rolling under-field snapshots for temporal AVERAGE

  const isolateSet = useMemo(() => parseIsolation(isolateInput, mod), [isolateInput, mod]);

  // Walk order for the prime slider/steppers. GROUP BY MOD-4 deliberately is NOT
  // ascending — it sweeps the 1-mod-4 primes and then the 3-mod-4 primes.
  const primePool = useMemo(() => {
    switch (primeSortFilter) {
      case 'rem1_only': return PRIMES.filter((p) => p % 4 === 1);
      case 'rem3_only': return PRIMES.filter((p) => p % 4 === 3);
      case 'by_rem':    return [2, ...PRIMES.filter((p) => p % 4 === 1),
                                   ...PRIMES.filter((p) => p % 4 === 3)];
      default:          return PRIMES;
    }
  }, [primeSortFilter]);

  // Ascending view of the same set, for snapping a typed modulus to the nearest member
  // by VALUE. (GROUP BY MOD-4 holds every prime, just reordered, so its sorted view is
  // simply PRIMES.)
  const primeSnapPool = primeSortFilter === 'by_rem' ? PRIMES : primePool;

  // Parsed interval anchor (= export start mod) and step.
  const intervalAnchor = clampMod(parseInt(expStartMod, 10) || 2);
  const intervalN = Math.max(1, Math.min(10000, parseInt(intervalStep, 10) || 1));
  // For sequence intervals, the valid mods form an explicit list (like primePool).
  const usingSeq = intervalOn && intervalSeq !== 'fixed';
  const intervalPool = useMemo(
    () => usingSeq ? buildSeqMods(intervalAnchor, MOD_CAP, intervalSeq, intervalN) : null,
    [usingSeq, intervalAnchor, intervalSeq, intervalN]
  );

  // Snap an arbitrary integer to the nearest value allowed by the active mode.
  const snapMod = useCallback((v) => {
    const x = clampMod(v);
    if (primeOnly) return nearest(primeSnapPool, x);
    if (usingSeq && intervalPool && intervalPool.length) return nearest(intervalPool, x);
    if (intervalOn) {
      // fixed step: snap to nearest anchor + k*step
      const k = Math.max(0, Math.round((x - intervalAnchor) / intervalN));
      return clampMod(intervalAnchor + k * intervalN);
    }
    if (modParity === 'even') return x % 2 === 0 ? x : (x + 1 <= MOD_CAP ? x + 1 : x - 1);
    if (modParity === 'odd') return x % 2 === 1 ? x : (x + 1 <= MOD_CAP ? x + 1 : x - 1);
    if (modParity === 'noprime') {
      // nearest composite (4 is the smallest); walk outward if x is prime
      if (!isPrime(x)) return x < 4 ? 4 : x;
      let up = x + 1, down = x - 1;
      while (up <= MOD_CAP || down >= 4) {
        if (down >= 4 && !isPrime(down)) return down;
        if (up <= MOD_CAP && !isPrime(up)) return up;
        up++; down--;
      }
      return 4;
    }
    return x;
  }, [primeOnly, primeSnapPool, modParity, intervalOn, intervalAnchor, intervalN, usingSeq, intervalPool]);

  // Rows to use when LINKED: mod, capped by the user's link cap and the hard MAX_SIZE.
  const linkedRows = useCallback((v) => {
    const cap = Math.max(2, Math.min(MAX_SIZE, parseInt(linkCap, 10) || MAX_SIZE));
    return Math.min(cap, Math.max(2, Math.floor(v)));
  }, [linkCap]);

  useEffect(() => {
    if (isPaired) setSize(linkedRows(mod));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [linkCap, isPaired]);

  // Re-snap the modulus whenever the selection mode (or its parameters) changes.
  useEffect(() => {
    if (modMode === 'all') return;
    setMod((cur) => {
      const snapped = snapMod(cur);
      if (isPaired) setSize(linkedRows(snapped));
      return snapped;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [modMode, primeSortFilter, intervalSeq, intervalStep, expStartMod, linkCap]);

  const commitMod = useCallback((raw) => {
    const num = Number(raw);
    if (!Number.isFinite(num)) return; // ignore NaN from transient slider/input events
    const next = snapMod(num);
    setMod(next);
    if (isPaired) setSize(linkedRows(next));
  }, [snapMod, isPaired, linkedRows]);

  const commitSize = useCallback((raw) => {
    const num = Number(raw);
    if (!Number.isFinite(num)) return;
    const next = Math.max(2, Math.min(MAX_SIZE, Math.floor(num)));
    setSize(next);
    if (isPaired) commitMod(next);
  }, [isPaired, commitMod]);

  // Pure: where the modulus would land stepping `dir` from `cur`, honoring the active mode.
  const nextModInDir = useCallback((cur, dir) => {
    if (primeOnly) {
      const idx = primePool.indexOf(cur);
      const nextIdx = idx === -1 ? 0 : (idx + dir + primePool.length) % primePool.length;
      return primePool[nextIdx];
    } else if (usingSeq && intervalPool && intervalPool.length) {
      const idx = nearestIndex(intervalPool, cur);
      const nextIdx = Math.max(0, Math.min(intervalPool.length - 1, idx + dir));
      return intervalPool[nextIdx];
    } else if (modParity === 'noprime') {
      let v = cur + dir;
      while (v >= 4 && v <= MOD_CAP && isPrime(v)) v += dir;
      return Math.max(4, Math.min(MOD_CAP, v));
    }
    const stepBy = intervalOn ? intervalN : (modParity === 'all' ? 1 : 2);
    return clampMod(cur + dir * stepBy);
  }, [primeOnly, primePool, modParity, intervalOn, intervalN, usingSeq, intervalPool]);

  const stepMod = useCallback((dir, skipSizeSync) => {
    const target = nextModInDir(mod, dir);
    setMod(target);
    if (isPaired && !skipSizeSync) setSize(linkedRows(target));
  }, [nextModInDir, mod, isPaired, linkedRows]);

  // First/last mod of the playback range, honoring the active mode (snapped to start mod).
  const playBounds = useCallback(() => {
    let lo = clampMod(parseInt(expStartMod, 10) || 2);
    let hi = clampMod(parseInt(expEndMod, 10) || MOD_CAP);
    if (lo > hi) { const t = lo; lo = hi; hi = t; }
    return { lo: snapMod(lo), hi: snapMod(hi) };
  }, [expStartMod, expEndMod, snapMod]);

  const jumpToStart = useCallback(() => {
    const { lo } = playBounds();
    setMod(lo);
    if (isPaired) setSize(linkedRows(lo));
  }, [playBounds, isPaired, linkedRows]);

  const stepSize = useCallback((dir) => {
    const next = Math.max(2, Math.min(MAX_SIZE, size + dir));
    setSize(next);
    if (isPaired) commitMod(next);
  }, [size, isPaired, commitMod]);

  const commitModDraft = useCallback(() => {
    if (modDraft !== null && modDraft !== '') commitMod(modDraft);
    setModDraft(null);
  }, [modDraft, commitMod]);

  const commitSizeDraft = useCallback(() => {
    if (sizeDraft !== null && sizeDraft !== '') commitSize(sizeDraft);
    setSizeDraft(null);
  }, [sizeDraft, commitSize]);

  useEffect(() => {
    const onDown = (e) => {
      const el = document.activeElement;
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
      const step = e.shiftKey ? 10 : 1;
      const map = {
        ArrowUp:    () => stepSize(step),
        ArrowDown:  () => stepSize(-step),
        ArrowRight: () => stepMod(step, false),
        ArrowLeft:  () => stepMod(-step, false),
      };
      if (map[e.key]) { e.preventDefault(); map[e.key](); }
    };
    window.addEventListener('keydown', onDown);
    return () => window.removeEventListener('keydown', onDown);
  }, [stepSize, stepMod]);

  // Row window: draw `size` rows starting at rowStart. Values still computed from row 0.
  // The computed height (rowStart + size) may exceed the display cap, up to COMPUTE_CAP,
  // so offsetting the start never steals rows from the bottom.
  const followPctC = Math.max(1, Math.min(400, parseInt(followModPct, 10) || 100));
  const rowStart = followMod
    ? followStart(Number.isFinite(mod) ? mod : 2, followPctC, Math.max(2, Math.min(size, COMPUTE_CAP - 2)))
    : Math.max(0, Math.min(COMPUTE_CAP - 2, parseInt(rowStartInput, 10) || 0));
  const dispRows = Math.max(2, Math.min(size, COMPUTE_CAP - rowStart));
  const fullRows = rowStart + dispRows; // total rows actually computed (top of window has real parents)

  const triangle = useMemo(
    () => buildTriangle(fullRows, Number.isFinite(mod) ? mod : 2),
    [fullRows, mod]
  );

  // Distinct residues present, for the status bar. A presence bitmap over the mod is
  // enough — the old version built a full Map of per-residue counts (millions of Map
  // writes per frame at large row counts) and then used only its size.
  const distinctResidues = useMemo(() => {
    const m = Number.isFinite(mod) ? Math.max(2, Math.floor(mod)) : 2;
    const seen = new Uint8Array(m);
    let n = 0;
    for (let i = 0; i < triangle.length; i++) { const v = triangle[i]; if (!seen[v]) { seen[v] = 1; n++; } }
    return n;
  }, [triangle, mod]);

  // --- Energy field: per-cell derived measure for heatmap-style mapping. ---
  // Returns { field: Float32Array | null, max }. null => use residue VALUE coloring.
  const energyField = useMemo(() => {
    const N = Math.max(2, Math.floor(fullRows));
    const m = Number.isFinite(mod) ? Math.max(2, Math.floor(mod)) : 2;
    return buildCombinedField(triangle, N, m, [...activeMaps], blendMode, P, motionHistRef.current, prevTemporalRef.current, fieldHistRef.current, censusRef.current, trailRef.current, adaptRef.current);
  }, [activeMaps, blendMode, triangle, fullRows, mod, P, censusTick]);

  // --- Sweep tween: what the PAINTERS read. Field maps morph (smoothstep lerp between
  // the true fields of consecutive moduli); anything without a compatible field —
  // pure VALUE coloring, row-count changes — falls back to a pixel dissolve handled in
  // the blit. Mid-flight retargets start from the field currently on screen, so fast
  // sweeps with long tweens flow instead of popping. DISPLAY-ONLY: histories, CENSUS,
  // hover readouts, and exports all consume the true energyField, never this.
  const displayField = useMemo(() => {
    const td = parseInt(tweenMs, 10);
    const dur = Math.max(0, Math.min(3000, Number.isFinite(td) ? td : 0));
    const curF = energyField ? energyField.field : null;
    if (lastTriRef.current !== triangle) {
      const shown = lastShownRef.current || lastFieldRef.current;
      if (dur > 0 && shown && curF && shown.length === curF.length && mapColorMode !== 'palette') {
        tweenRef.current = { mode: 'morph', t0: performance.now(), dur, prevField: shown.slice(0) };
      } else if (dur > 0 && lastTriRef.current !== null) {
        tweenRef.current = { mode: 'fade', t0: 0, dur, snap: false }; // t0 set at snapshot
      } else {
        tweenRef.current = { mode: null };
      }
      lastTriRef.current = triangle;
    }
    lastFieldRef.current = curF;
    const tw = tweenRef.current;
    if (tw.mode === 'morph' && curF) {
      const t = Math.min(1, (performance.now() - tw.t0) / tw.dur);
      if (t < 1) {
        const e = t * t * (3 - 2 * t); // smoothstep
        const a = tw.prevField, n = curF.length;
        let buf = lerpBufRef.current;
        if (!buf || buf.length !== n) { buf = new Float32Array(n); lerpBufRef.current = buf; }
        for (let i = 0; i < n; i++) buf[i] = a[i] + (curF[i] - a[i]) * e;
        lastShownRef.current = buf;
        return { ...energyField, field: buf };
      }
      tweenRef.current = { mode: null };
    }
    lastShownRef.current = curF;
    return energyField;
  }, [energyField, triangle, tweenMs, tweenTick, mapColorMode]);

  // Morph pump: while a field morph is in flight, schedule the next interpolation frame.
  useEffect(() => {
    if (tweenRef.current.mode !== 'morph') return;
    const id = requestAnimationFrame(() => setTweenTick((x) => x + 1));
    return () => cancelAnimationFrame(id);
  }, [displayField]);

  // PALETTE BLEND: the color maps operate on the palette image itself. Built only when
  // palette mode is on and any map is active; transforms (AVERAGE, BAND PASS) run per
  // RGB channel so hues genuinely blend. Reads the color history one-behind, like the
  // scalar pipeline.
  const colorPlanes = useMemo(() => {
    if (mapColorMode !== 'palette') return null;
    const ids = [...activeMaps];
    if (ids.every((id) => id === 'value')) return null; // pure VALUE: plain palette, nothing to process
    const m = Number.isFinite(mod) ? Math.max(2, Math.floor(mod)) : 2;
    const infoCache = new Map();
    const colorInfo = (v) => {
      let info = infoCache.get(v);
      if (info === undefined) {
        const rgb = parseColorRgb(residueColor(v, m, colorScheme, null)); // unmasked palette color
        const [h, s] = rgbToHueSat(rgb[0], rgb[1], rgb[2]);
        info = { rgb, h, s };
        infoCache.set(v, info);
      }
      return info;
    };
    return buildColorPlanes(triangle, fullRows, m, ids, blendMode, P, motionHistRef.current, prevTemporalRef.current, colorHistRef.current, censusRef.current, colorInfo, trailRef.current, adaptColorRef.current);
  }, [mapColorMode, activeMaps, blendMode, triangle, fullRows, mod, colorScheme, P, censusTick]);

  // Record the pre-transform palette image for temporal AVERAGE in PALETTE BLEND mode
  // (8-bit per channel: display precision). Gated exactly like the scalar field history.
  useEffect(() => {
    const needed = mapColorMode === 'palette' && activeMaps.has('average') && P.avgMode === 'temporal' && colorPlanes && colorPlanes.pre;
    if (!needed) {
      if (colorHistRef.current.size !== 0) colorHistRef.current = { size: 0, frames: [] };
      return;
    }
    const pre = colorPlanes.pre;
    const total = pre.r.length;
    const frame = new Uint8ClampedArray(total * 3);
    for (let i = 0; i < total; i++) {
      frame[i * 3] = pre.r[i] * 255; frame[i * 3 + 1] = pre.g[i] * 255; frame[i * 3 + 2] = pre.b[i] * 255;
    }
    const ch = colorHistRef.current;
    if (!ch || ch.size !== total) { colorHistRef.current = { size: total, frames: [frame] }; return; }
    ch.frames.push(frame);
    while (ch.frames.length > 64) ch.frames.shift();
    colorHistRef.current = { size: total, frames: ch.frames };
  }, [colorPlanes, mapColorMode, activeMaps, P.avgMode]);

  // Advance the AFTERIMAGE adaptation once per frame from the pre-ghost signal the
  // pipeline just produced. One-behind by construction, like the temporal AVERAGE
  // history: the ghost on screen is the complement of PAST exposure, never of the
  // current frame. Guarded on frame identity so editing STRENGTH/ATTACK/DECAY
  // re-renders the mix without also stepping time forward.
  useEffect(() => {
    if (!activeMaps.has('afterimage')) {
      if (adaptRef.current.size !== 0) adaptRef.current = { size: 0, s: null };
      if (adaptColorRef.current.size !== 0) adaptColorRef.current = { size: 0, r: null, g: null, b: null };
      adaptLastRef.current = null;
      return;
    }
    if (adaptLastRef.current === triangle) return;
    const { atk, dec } = afterimageParams(P);
    if (mapColorMode === 'palette' && colorPlanes && colorPlanes.adaptIn) {
      const inp = colorPlanes.adaptIn, n = inp.r.length, A = adaptColorRef.current, ok = A.size === n;
      adaptColorRef.current = {
        size: n,
        r: adaptStep(inp.r, ok ? A.r : null, atk, dec),
        g: adaptStep(inp.g, ok ? A.g : null, atk, dec),
        b: adaptStep(inp.b, ok ? A.b : null, atk, dec),
      };
    } else if (energyField && energyField.adaptIn) {
      const inp = energyField.adaptIn, n = inp.length, A = adaptRef.current;
      adaptRef.current = { size: n, s: adaptStep(inp, A.size === n ? A.s : null, atk, dec) };
    } else {
      return; // nothing to adapt to yet
    }
    adaptLastRef.current = triangle;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [triangle, activeMaps, mapColorMode, energyField, colorPlanes, P.aiAttack, P.aiDecay]);

  // Record the under-field (pre-average) for temporal AVERAGE history.
  // Only recorded while AVERAGE(temporal) is active: at 2000 rows each snapshot is ~8MB
  // and the 64-frame buffer would otherwise pin ~0.5GB doing nothing.
  useEffect(() => {
    const needed = activeMaps.has('average') && P.avgMode === 'temporal';
    const under = needed ? (energyField && energyField.under) : null;
    if (!under) {
      if (fieldHistRef.current.size !== 0) fieldHistRef.current = { size: 0, frames: [] };
      return;
    }
    const total = under.length;
    const fh = fieldHistRef.current;
    if (!fh || fh.size !== total) { fieldHistRef.current = { size: total, frames: [under.slice(0)] }; return; }
    fh.frames.push(under.slice(0));
    while (fh.frames.length > 64) fh.frames.shift();
    fieldHistRef.current = { size: total, frames: fh.frames };
  }, [energyField, activeMaps, P.avgMode]);

  // Maintain the rolling residue history for motion magnification.
  // Only recorded while MAGNIFY is active (same memory rationale as above); the window
  // therefore fills from the moment the map is enabled.
  useEffect(() => {
    if (!activeMaps.has('magnify')) {
      if (motionHistRef.current.size !== 0) motionHistRef.current = { size: 0, frames: [] };
      return;
    }
    const total = triangle.length;
    const hist = motionHistRef.current;
    if (!hist || hist.size !== total) {
      motionHistRef.current = { size: total, frames: [triangle.slice(0)] };
      return;
    }
    const frames = hist.frames;
    frames.push(triangle.slice(0));
    while (frames.length > 64) frames.shift();
    motionHistRef.current = { size: total, frames };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [triangle, activeMaps]);

  // Accumulate the divisor census while the CENSUS map is active: per-cell count of
  // sampled moduli where the cell was zero. Unlike the frame histories, this is a
  // single frame-sized accumulator of a deliberate measurement, so it is PRESERVED
  // when the map is toggled off — only RESET (or a row-count change, which misaligns
  // cells) clears it. The last-triangle guard stops unrelated map toggles from
  // double-counting the same modulus.
  useEffect(() => {
    if (!activeMaps.has('census')) return;
    if (censusLastRef.current === triangle) return;
    const total = triangle.length;
    let cs = censusRef.current;
    if (!cs || cs.size !== total || !cs.sum) {
      cs = { size: total, sum: new Float32Array(total), count: 0 };
      censusRef.current = cs;
    }
    const sum = cs.sum;
    for (let i = 0; i < total; i++) if (triangle[i] === 0) sum[i] += 1;
    cs.count++;
    censusLastRef.current = triangle;
    setCensusN(cs.count);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [triangle, activeMaps]);

  const resetCensus = () => {
    censusRef.current = { size: 0, sum: null, count: 0 };
    censusLastRef.current = null;
    setCensusN(0);
    setCensusTick((t) => t + 1); // force the field memo to recompute without a mod change
  };

  // Advance the TRAIL accumulator once per frame while the map is active — the same
  // shared trailStep the display uses, so recorded state and shown frame cannot drift.
  // Freed when the map is off: a trail is ephemeral by nature (it would have faded).
  useEffect(() => {
    if (!activeMaps.has('trail')) {
      if (trailRef.current.size !== 0) trailRef.current = { size: 0, prev: null, e: null, tri: null, key: '' };
      return;
    }
    const total = triangle.length;
    const key = `${P.trailTarget}|${P.trailWidth}|${P.trailLen}`;
    const cur = trailRef.current;
    if (cur.size === total && cur.tri === triangle && cur.key === key) return;
    const m = Number.isFinite(mod) ? Math.max(2, Math.floor(mod)) : 2;
    const base = cur.size === total ? (cur.tri === triangle ? cur.prev : cur.e) : null;
    trailRef.current = { size: total, prev: base, e: trailStep(triangle, m, P, base), tri: triangle, key };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [triangle, activeMaps, mod, P.trailTarget, P.trailWidth, P.trailLen]);

  // Record current residues for the next temporal diff (after field is computed).
  useEffect(() => {
    prevTemporalRef.current = { mod, residues: triangle.slice(0) };
  }, [triangle, mod]);

  // Color is computed on demand (not a dense mod-sized array), so very large
  // mods cost nothing extra. A small cache keeps the offscreen paint fast since
  // a given residue repeats across many cells. Delegates to the shared
  // residueColor so the on-screen preview always matches the exported frames.
  const colorFor = useMemo(() => {
    const cache = new Map();
    return (v) => {
      const hit = cache.get(v);
      if (hit !== undefined) return hit;
      const color = residueColor(v, mod, colorScheme, isolateSet);
      cache.set(v, color);
      return color;
    };
  }, [mod, colorScheme, isolateSet]);

  // Color a cell by flat index: residue VALUE coloring, or the active energy field.
  // When isolation is set, the field is shown only on isolated cells; others -> BG.
  const cellColorAt = useMemo(() => {
    const { field, max, signed } = displayField;
    if (!field) return (i) => colorFor(triangle[i]);
    const iso = isolateSet;
    const fcache = new Map();
    if (mapColorMode === 'palette' && colorPlanes) {
      // PALETTE BLEND: cells read the processed palette image (transforms ran per RGB
      // channel, so hues actually blend). Isolation masks the OUTPUT.
      const { r: PR, g: PG, b: PB } = colorPlanes;
      const scache = new Map(); // packed rgb -> string
      return (i) => {
        const v = triangle[i];
        if (iso && !iso.has(v)) return BG;
        const r = Math.max(0, Math.min(255, Math.round(PR[i] * 255)));
        const g = Math.max(0, Math.min(255, Math.round(PG[i] * 255)));
        const b = Math.max(0, Math.min(255, Math.round(PB[i] * 255)));
        const key = (r << 16) | (g << 8) | b;
        let col = scache.get(key);
        if (col === undefined) { col = `rgb(${r}, ${g}, ${b})`; scache.set(key, col); }
        return col;
      };
    }
    if (signed) {
      const inv = 1 / (max || 1);
      return (i) => {
        if (iso && !iso.has(triangle[i])) return BG; // masked out by isolation
        // -max..+max -> 0..1, centered at 0.5 (no-change = mid palette)
        const ratio = 0.5 + 0.5 * Math.max(-1, Math.min(1, field[i] * inv));
        const q = Math.round(ratio * 255);
        let col = fcache.get(q);
        if (col === undefined) { col = rampColor(colorScheme, q / 255); fcache.set(q, col); }
        return col;
      };
    }
    const inv = 1 / (max || 1);
    return (i) => {
      if (iso && !iso.has(triangle[i])) return BG; // masked out by isolation
      const q = Math.round(field[i] * inv * 255); // quantize for cache hits
      let col = fcache.get(q);
      if (col === undefined) { col = rampColor(colorScheme, q / 255); fcache.set(q, col); }
      return col;
    };
  }, [displayField, colorPlanes, colorFor, triangle, colorScheme, isolateSet, mapColorMode]);

  const { cellW, cellH } = useMemo(() => {
    const w = Math.max(3, Math.min(24, Math.floor(1200 / fullRows)));
    return { cellW: w, cellH: w * 0.866 };
  }, [fullRows]);

  // In 'equi' half layout, cells are spaced 2x so the centered half fills a true
  // equilateral footprint (same proportions as the full triangle).
  const halfColW = (halfMode !== 'full' && halfLayout === 'equi') ? cellW * 2 : cellW;

  // Horizontal center (world coords, row centered at 0) of cell (r,c).
  //  'shape' = original triangle position; 'equi' = each half-row centered into an
  //  equilateral triangle.
  const cellCenterX = useCallback((r, c) => {
    if (halfMode === 'full' || halfLayout === 'shape') return (c - r / 2) * cellW;
    const w2 = (halfLayout === 'equi') ? cellW * 2 : cellW;
    if (halfMode === 'left') {
      const K = Math.floor(r / 2) + 1;        // cells in this half-row
      return (c - (K - 1) / 2) * w2;          // centered
    }
    const lead = Math.ceil(r / 2);
    const K = r - lead + 1;
    return ((c - lead) - (K - 1) / 2) * w2;    // centered
  }, [cellW, halfMode, halfLayout]);

  // Offscreen bitmap width: tight & centered for 'equi', full width for 'shape'/full.
  const offShapeW = useMemo(() => {
    if (halfMode === 'full' || halfLayout === 'shape') return fullRows * cellW;
    const bottom = fullRows - 1;
    const K = (halfMode === 'left' ? Math.floor(bottom / 2) : bottom - Math.ceil(bottom / 2)) + 1;
    return K * (cellW * 2);
  }, [halfMode, halfLayout, fullRows, cellW]);

  const drawMainScene = useCallback(() => {
    const canvas = canvasRef.current, offscreen = offscreenRef.current;
    if (!canvas || !offscreen) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width / dpr, h = canvas.height / dpr;
    if (!w || !h) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2 + pan.x, pan.y);
    ctx.scale(zoom, zoom);
    ctx.imageSmoothingEnabled = zoom < 3.0;
    const twD = tweenRef.current;
    let fadeT = 1;
    if (twD.mode === 'fade' && twD.snap) {
      fadeT = Math.min(1, (performance.now() - twD.t0) / twD.dur);
      if (fadeT >= 1) { twD.mode = null; twD.snap = false; }
    }
    if (fadeT < 1 && prevCanvasRef.current) {
      const pc = prevCanvasRef.current;
      ctx.drawImage(pc, -pc.width / 2, 0, pc.width, pc.height);
      ctx.globalAlpha = fadeT * fadeT * (3 - 2 * fadeT); // smoothstep dissolve, new over old
      ctx.drawImage(offscreen, -offscreen.width / 2, 0, offscreen.width, offscreen.height);
      ctx.globalAlpha = 1;
      if (!rafPendingRef.current) {
        rafPendingRef.current = true;
        requestAnimationFrame(() => { rafPendingRef.current = false; if (drawRef.current) drawRef.current(); });
      }
    } else {
      ctx.drawImage(offscreen, -offscreen.width / 2, 0, offscreen.width, offscreen.height);
    }

    // On-screen cell size in CSS px. Digits only render when readable.
    const screenCell = cellW * zoom;
    const NUM_THRESHOLD = 13; // px per cell before digits appear
    if (showNumbers && viewMode === '2d' && screenCell >= NUM_THRESHOLD) {
      // Dim the color bed in plain mode so digits dominate.
      if (numberMode === 'plain') {
        ctx.save();
        ctx.globalAlpha = 0.78;
        ctx.fillStyle = BG;
        ctx.fillRect(-offscreen.width / 2, 0, offscreen.width, offscreen.height);
        ctx.restore();
      }
      // Visible world rectangle (inverse of translate+scale).
      const viewL = (-(w / 2) - pan.x) / zoom;
      const viewR = ((w - w / 2) - pan.x) / zoom;
      const viewT = (0 - pan.y) / zoom;
      const viewB = (h - pan.y) / zoom;
      const rStart = rowStart + Math.max(0, Math.floor(viewT / cellH));
      const rEnd = Math.min(fullRows - 1, rowStart + Math.ceil(viewB / cellH));

      const fontPx = Math.min(cellH, cellW) * 0.62;
      ctx.font = `${fontPx}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // pick black/white ink against a given css color by luminance
      const inkFor = (css) => {
        let r = 128, g = 128, b = 128;
        const rgb = css.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
        if (rgb) { r = +rgb[1]; g = +rgb[2]; b = +rgb[3]; }
        else {
          const hsl = css.match(/hsl\(([\d.]+),\s*([\d.]+)%,\s*([\d.]+)%\)/);
          if (hsl) { const L = +hsl[3]; return L > 55 ? '#000' : '#fff'; }
        }
        const lum = (0.299 * r + 0.587 * g + 0.114 * b);
        return lum > 140 ? '#000' : '#fff';
      };

      for (let r = rStart; r <= rEnd; r++) {
        const rowStart0 = (r * (r + 1)) / 2;
        const y = (r - rowStart) * cellH + cellH / 2;
        const cTo = halfCTo(r, halfMode);
        for (let c = halfCFrom(r, halfMode); c <= cTo; c++) {
          const x = cellCenterX(r, c);
          if (x < viewL - cellW || x > viewR + cellW) continue; // cull off-view
          const v = triangle[rowStart0 + c];
          if (numberMode === 'overlay' && v === 0) continue; // keep voids clean
          if (numberMode === 'overlay') {
            ctx.fillStyle = inkFor(colorFor(v)); // contrast against this cell's actual color
          } else {
            ctx.fillStyle = '#d9e6c8';
          }
          ctx.fillText(String(v), x, y);
        }
      }
    }

    if (hoveredCell) {
      const { row: r, col: c } = hoveredCell;
      const hx = cellCenterX(r, c);
      ctx.strokeStyle = '#ff3b30';
      ctx.lineWidth = Math.max(1.5, 3 / zoom);
      ctx.strokeRect(hx - cellW / 2, (r - rowStart) * cellH, cellW, cellH);
    }
    ctx.restore();
  }, [zoom, pan, hoveredCell, cellW, cellH, showNumbers, numberMode, rowStart, dispRows, fullRows, triangle, halfMode, halfLayout, cellCenterX]);

  const drawRef = useRef(drawMainScene);
  useEffect(() => { drawRef.current = drawMainScene; });

  useEffect(() => {
    if (!offscreenRef.current) offscreenRef.current = document.createElement('canvas');
    const off = offscreenRef.current;
    const twP = tweenRef.current;
    if (twP.mode === 'fade' && !twP.snap && off.width > 0 && off.height > 0) {
      let pc = prevCanvasRef.current;
      if (!pc) { pc = document.createElement('canvas'); prevCanvasRef.current = pc; }
      pc.width = off.width; pc.height = off.height;
      pc.getContext('2d').drawImage(off, 0, 0);
      twP.t0 = performance.now(); twP.snap = true;
    }
    const mode3d = viewMode !== '2d';
    const tz = parseInt(zScale3d, 10);
    const zRows = Math.max(0, Math.min(200, Number.isFinite(tz) ? tz : 40));
    const zMax = mode3d ? zRows * cellH : 0;
    const rowH = mode3d ? Math.max(0.5, cellH * RELIEF_SQUASH) : cellH;
    const width = offShapeW + 10, height = Math.ceil(dispRows * rowH + zMax + 10);
    off.width = width; off.height = height;
    const ctx = off.getContext('2d');
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, width, height);
    const pad = Math.max(0.15, cellW * 0.05);
    const cw = halfColW - pad, ch = cellH - pad;
    if (viewMode === 'lattice') {
      // Wireframe blanket: shared lattice engine over the same axonometric frame.
      const F = displayField ? displayField.field : null;
      const mNow = Number.isFinite(mod) ? Math.max(2, Math.floor(mod)) : 2;
      const dnm = (mNow - 1) || 1;
      const ts = parseInt(meshStep, 10);
      const manual = Number.isFinite(ts) ? ts : 0;
      const step = Math.max(1, Math.min(64, manual > 0 ? manual : Math.ceil(dispRows / 300)));
      paintLattice(ctx, {
        N: fullRows, off: rowStart, step, zMax, rowH, bg: BG,
        lineW: Math.max(0.75, cellW * step * 0.05),
        xOf: (r, c) => width / 2 + cellCenterX(r, c),
        colorAt: (i) => cellColorAt(i),
        heightAt: (i) => { let h = F ? F[i] : triangle[i] / dnm; return h < 0 ? 0 : h > 1 ? 1 : h; },
      });
    } else if (viewMode === 'relief') {
      // Isometric height field: z = combined map field (or residue ratio when no maps).
      // Rows paint back-to-front; tall columns in nearer rows occlude what's behind.
      const F = displayField ? displayField.field : null;
      const mNow = Number.isFinite(mod) ? Math.max(2, Math.floor(mod)) : 2;
      const dnm = (mNow - 1) || 1;
      const chTop = Math.max(0.3, rowH - pad * RELIEF_SQUASH);
      for (let r = rowStart; r < fullRows; r++) {
        const rowStart0 = (r * (r + 1)) / 2;
        const yBase = zMax + (r - rowStart) * rowH;   // ground line of this row
        const cTo = halfCTo(r, halfMode);
        for (let c = halfCFrom(r, halfMode); c <= cTo; c++) {
          const i = rowStart0 + c;
          const col = cellColorAt(i);
          if (col === BG) continue; // isolation-masked
          let h01 = F ? F[i] : triangle[i] / dnm;
          if (h01 < 0) h01 = 0; else if (h01 > 1) h01 = 1;
          const zPix = h01 * zMax;
          const x = width / 2 + cellCenterX(r, c) - cw / 2;
          const topY = yBase - zPix;
          if (zPix > 0.5) { ctx.fillStyle = shadeColor(col, 0.55); ctx.fillRect(x, topY + chTop, cw, zPix); }
          ctx.fillStyle = col;
          ctx.fillRect(x, topY, cw, chTop);
        }
      }
    } else {
      for (let r = rowStart; r < fullRows; r++) {
        const rowStart0 = (r * (r + 1)) / 2;
        const y = (r - rowStart) * cellH;            // window top row sits at y=0
        const cTo = halfCTo(r, halfMode);
        for (let c = halfCFrom(r, halfMode); c <= cTo; c++) {
          ctx.fillStyle = cellColorAt(rowStart0 + c);
          ctx.fillRect(width / 2 + cellCenterX(r, c) - cw / 2, y, cw, ch);
        }
      }
    }

    drawRef.current?.();
  }, [triangle, cellColorAt, cellW, cellH, rowStart, dispRows, fullRows, halfMode, halfLayout, offShapeW, halfColW, cellCenterX, viewMode, zScale3d, meshStep, displayField, mod]);

  useEffect(() => { drawRef.current?.(); }, [zoom, pan, hoveredCell, showNumbers, numberMode]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const parent = canvas.parentElement || canvas;
    const update = () => {
      const rect = parent.getBoundingClientRect();
      rectRef.current = rect;
      if (rect.width > 0 && rect.height > 0) {
        const dpr = window.devicePixelRatio || 1;
        const tw = Math.floor(rect.width * dpr), th = Math.floor(rect.height * dpr);
        if (canvas.width !== tw || canvas.height !== th) { canvas.width = tw; canvas.height = th; }
        drawRef.current?.();
      }
