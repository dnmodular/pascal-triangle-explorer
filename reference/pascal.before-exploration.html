    ro.observe(parent);
    update();
    return () => ro.disconnect();
  }, []);

  const pointerPos = (e) => {
    const rect = rectRef.current || canvasRef.current?.getBoundingClientRect() || { left: 0, top: 0, width: 0 };
    const src = e.touches?.[0] || e.changedTouches?.[0] || e;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top, rect };
  };
  const onMove = (e) => {
    if (!canvasRef.current || !offscreenRef.current) return;
    const p = pointerPos(e);
    if (isDragging.current) {
      setPan({ x: p.x - dragStart.current.x, y: p.y - dragStart.current.y });
      return;
    }
    if (viewMode !== '2d') { if (hoveredCell) setHoveredCell(null); return; } // heights make the inverse map ambiguous
    const worldX = (p.x - p.rect.width / 2 - pan.x) / zoom;
    const worldY = (p.y - pan.y) / zoom;
    const r = rowStart + Math.floor(worldY / cellH); // window top is row rowStart
    if (r >= rowStart && r < fullRows) {
      let c;
      if (halfMode === 'full' || halfLayout === 'shape') {
        const startX = -(r * cellW) / 2;
        c = Math.floor((worldX - startX + cellW / 2) / cellW);
      } else {
        // invert the centered equilateral packing
        const w2 = (halfLayout === 'equi') ? cellW * 2 : cellW;
        if (halfMode === 'left') {
          const K = Math.floor(r / 2) + 1;
          c = Math.round(worldX / w2 + (K - 1) / 2);
        } else {
          const lead = Math.ceil(r / 2);
          const K = r - lead + 1;
          c = Math.round(worldX / w2 + (K - 1) / 2) + lead;
        }
      }
      if (c >= 0 && c <= r && inHalf(r, c, halfMode)) {
        const val = triangle[(r * (r + 1)) / 2 + c];
        if (val !== undefined &&
            (!hoveredCell || hoveredCell.row !== r || hoveredCell.col !== c)) {
          setHoveredCell({ row: r, col: c, val });
        }
        return;
      }
    }
    if (hoveredCell) setHoveredCell(null);
  };
  const onDown = (e) => {
    isDragging.current = true;
    const p = pointerPos(e);
    dragStart.current = { x: p.x - pan.x, y: p.y - pan.y };
    pickDownRef.current = { x: p.x, y: p.y };
  };
  const onUp = (e) => {
    isDragging.current = false;
    // Eyedropper: a click (not a drag) on a hovered 2D cell adopts its residue as the
    // TRAIL target, then disarms.
    if (trailPicking && viewMode === '2d' && hoveredCell && e && pickDownRef.current) {
      const p = pointerPos(e);
      const dx = p.x - pickDownRef.current.x, dy = p.y - pickDownRef.current.y;
      if (dx * dx + dy * dy < 25) {
        const { row, col } = hoveredCell;
        const v = triangle[(row * (row + 1)) / 2 + col];
        const mNow = Number.isFinite(mod) ? Math.max(2, Math.floor(mod)) : 2;
        setP('trailTarget', v === 0 ? 'void' : v === 1 ? 'white' : String(Math.round(spectralPos(v, mNow) * 999)));
        setTrailPicking(false);
      }
    }
    pickDownRef.current = null;
  };
  const onWheel = (e) => {
    e.preventDefault();
    const next = e.deltaY < 0 ? zoom * 1.15 : zoom / 1.15;
    setZoom(Math.max(0.1, Math.min(40, next)));
  };

  useEffect(() => {
    if (!isPlaying) return;
    const id = setInterval(() => {
      const { lo, hi } = playBounds();
      setMod((cur) => {
        const target = nextModInDir(cur, playDir);
        // detect hitting (or sitting at) the range edge in the play direction
        const atEdge = (playDir > 0 && (target >= hi || target === cur))
                    || (playDir < 0 && (target <= lo || target === cur));
        let next = target;
        if (playDir > 0 && target > hi) next = playLoop ? lo : hi;
        if (playDir < 0 && target < lo) next = playLoop ? hi : lo;
        if (atEdge && !playLoop) {
          // clamp to the edge and stop after this frame
          next = playDir > 0 ? hi : lo;
          setIsPlaying(false);
        } else if (atEdge && playLoop && target === cur) {
          next = playDir > 0 ? lo : hi; // unstick if step couldn't move
        }
        if (isPaired && !keepSizeFixed) setSize(linkedRows(next));
        return next;
      });
    }, playSpeed);
    return () => clearInterval(id);
  }, [isPlaying, playSpeed, keepSizeFixed, playDir, playLoop, nextModInDir, playBounds, isPaired, linkedRows]);

  const resetView = () => { setZoom(1.0); setPan({ x: 0, y: 40 }); setHoveredCell(null); };
  const download = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    // name what the image actually shows: the drawn window, not the ROWS setting
    a.download = `pascal-mod${mod}-rows${dispRows}${rowStart ? '@' + rowStart : ''}-${colorScheme}.png`;
    a.click();
  };

  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load failed: ' + src));
    document.head.appendChild(s);
  });

  const loadJSZip = async () => {
    if (window.JSZip) return window.JSZip;
    const sources = [
      'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
      'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
    ];
    for (const src of sources) {
      try {
        await loadScript(src);
        if (window.JSZip) return window.JSZip;
      } catch (e) { /* try next */ }
    }
    throw new Error('Could not load ZIP library from any CDN (check your connection).');
  };

  // Render one frame for `modVal`. Takes an options bag rather than the 13 positional
  // arguments it grew to, and measures itself with the shared frameGeom so the export's
  // uniform canvas is always big enough for what actually gets drawn.
  const renderTriangleNative = ({ modVal, rows, px, scheme, isoInput, mapCtx,
    rowOff = 0, half = 'full', layout = 'equi', view = '2d', zRows = 40, mesh = 0 }) => {
    const g = frameGeom({ rows, rowOff, px, half, layout, view, zRows });
    rows = Math.max(2, rows);
    const off = g.off;                    // window start row
    const N = g.N;                        // full rows computed
    const tri = buildTriangle(N, modVal);
    const m = Math.max(2, modVal);
    // centered equilateral placement (px units), mirrors the live cellCenterX
    const px2 = g.px2;                    // 2x spacing for equilateral
    const centerXpx = (r, c) => {
      if (half === 'full' || layout === 'shape') return (c - r / 2) * px;
      if (half === 'left') { const K = Math.floor(r / 2) + 1; return (c - (K - 1) / 2) * px2; }
      const lead = Math.ceil(r / 2); const K = r - lead + 1; return ((c - lead) - (K - 1) / 2) * px2;
    };
    const drawW = g.cellW;                // cell width
    const midX = g.w / 2;
    const zMaxE = g.zMax;
    const rowHE = g.rowH;
    const cv = document.createElement('canvas');
    cv.width = g.w;
    cv.height = g.h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, cv.width, cv.height);

    // Parsed once — each of the four draw branches below used to re-parse it.
    const isoSetE = parseIsolation(isoInput, modVal);
    // If map layers are active, color by the combined field (mirrors live view).
    let fieldInfo = null;
    if (mapCtx && mapCtx.activeIds.some((id) => id !== 'value')) {
      fieldInfo = buildCombinedField(tri, N, m, mapCtx.activeIds, mapCtx.blendMode, mapCtx.P, mapCtx.hist, mapCtx.prev, mapCtx.fieldHist, mapCtx.census, mapCtx.trail, mapCtx.adapt);
    }
    // PALETTE BLEND: process the palette image itself (per-channel transforms), mirroring live.
    let planes = null;
    if (mapCtx && mapCtx.colorMode === 'palette' && fieldInfo && fieldInfo.field) {
      const infoCache = new Map();
      const colorInfo = (v) => {
        let info = infoCache.get(v);
        if (info === undefined) {
          const rgb = parseColorRgb(residueColor(v, modVal, scheme, null));
          const [h, s] = rgbToHueSat(rgb[0], rgb[1], rgb[2]);
          info = { rgb, h, s };
          infoCache.set(v, info);
        }
        return info;
      };
      planes = buildColorPlanes(tri, N, m, mapCtx.activeIds, mapCtx.blendMode, mapCtx.P, mapCtx.hist, mapCtx.prev, mapCtx.colorHist, mapCtx.census, colorInfo, mapCtx.trail, mapCtx.adaptColor);
    }
    const planeColor = planes ? (() => {
      const scache = new Map();
      return (i) => {
        const r = Math.max(0, Math.min(255, Math.round(planes.r[i] * 255)));
        const g = Math.max(0, Math.min(255, Math.round(planes.g[i] * 255)));
        const b = Math.max(0, Math.min(255, Math.round(planes.b[i] * 255)));
        const key = (r << 16) | (g << 8) | b;
        let col = scache.get(key);
        if (col === undefined) { col = `rgb(${r}, ${g}, ${b})`; scache.set(key, col); }
        return col;
      };
    })() : null;

    if (view === 'lattice') {
      // 3D lattice export: the exact shared engine the live view uses.
      const isoSetL = isoSetE;
      const fieldL = fieldInfo ? fieldInfo.field : null;
      const invL = fieldL ? 1 / (fieldInfo.max || 1) : 0;
      const denomL = (m - 1) || 1;
      const fcacheL = new Map(), vcacheL = new Map();
      const colorAtL = (i) => {
        const v = tri[i];
        if (fieldL) {
          if (isoSetL && !isoSetL.has(v)) return BG;
          let h = fieldL[i] * invL; h = h < 0 ? 0 : h > 1 ? 1 : h;
          const q = Math.round(h * 255);
          if (planeColor) {
            return planeColor(i);
          }
          let col = fcacheL.get(q);
          if (col === undefined) { col = rampColor(scheme, q / 255); fcacheL.set(q, col); }
          return col;
        }
        let col = vcacheL.get(v);
        if (col === undefined) { col = residueColor(v, modVal, scheme, isoSetL); vcacheL.set(v, col); }
        return col;
      };
      const heightAtL = (i) => { let h = fieldL ? fieldL[i] * invL : tri[i] / denomL; return h < 0 ? 0 : h > 1 ? 1 : h; };
      const stepE = Math.max(1, Math.min(64, mesh > 0 ? mesh : Math.ceil((N - off) / 300)));
      paintLattice(ctx, {
        N, off, step: stepE, zMax: zMaxE, rowH: rowHE, bg: BG,
        lineW: Math.max(0.75, px * stepE * 0.05),
        xOf: (r, c) => midX + centerXpx(r, c),
        colorAt: colorAtL, heightAt: heightAtL,
      });
    } else if (view === 'relief') {
      // 3D relief export: mirrors the live isometric view (color parity with the 2D
      // branches below; height = field value, or residue ratio when no maps active).
      const isoSet = isoSetE;
      const field = fieldInfo ? fieldInfo.field : null;
      const inv = field ? 1 / (fieldInfo.max || 1) : 0;
      const denomV = (m - 1) || 1;
      const fcache = new Map(), vcache = new Map();
      const chTopE = Math.max(0.3, rowHE - Math.max(0.15, px * 0.05) * RELIEF_SQUASH);
      for (let r = off; r < N; r++) {
        const rowStart = (r * (r + 1)) / 2;
        const yBase = zMaxE + (r - off) * rowHE;
        const cTo = halfCTo(r, half);
        for (let c = halfCFrom(r, half); c <= cTo; c++) {
          const i = rowStart + c, v = tri[i];
          let col, h01;
          if (field) {
            if (isoSet && !isoSet.has(v)) continue;
            h01 = field[i] * inv; if (h01 < 0) h01 = 0; else if (h01 > 1) h01 = 1;
            const q = Math.round(h01 * 255);
            if (planeColor) {
              col = planeColor(i);
            } else {
              col = fcache.get(q);
              if (col === undefined) { col = rampColor(scheme, q / 255); fcache.set(q, col); }
            }
          } else {
            col = vcache.get(v);
            if (col === undefined) { col = residueColor(v, modVal, scheme, isoSet); vcache.set(v, col); }
            if (col === BG) continue;
            h01 = v / denomV;
          }
          const zPix = h01 * zMaxE;
          const x = Math.round(midX + centerXpx(r, c) - drawW / 2), w = Math.ceil(drawW);
          const topY = yBase - zPix;
          if (zPix > 0.5) { ctx.fillStyle = shadeColor(col, 0.55); ctx.fillRect(x, topY + chTopE, w, zPix); }
          ctx.fillStyle = col;
          ctx.fillRect(x, topY, w, chTopE);
        }
      }
    } else if (fieldInfo && fieldInfo.field) {
      const { field, max } = fieldInfo;
      const inv = 1 / (max || 1);
      const isoSet = isoSetE; // mask field to isolated cells
      const tint = mapCtx && mapCtx.colorMode === 'palette';
      const fcache = new Map();
      for (let r = off; r < N; r++) {
        const rowStart = (r * (r + 1)) / 2;
        const y = (r - off) * px;
        const cTo = halfCTo(r, half);
        for (let c = halfCFrom(r, half); c <= cTo; c++) {
          const v = tri[rowStart + c];
          if (isoSet && !isoSet.has(v)) continue;
          const q = Math.round(field[rowStart + c] * inv * 255);
          let col;
          if (tint && planeColor) {
            col = planeColor(rowStart + c);
          } else {
            col = fcache.get(q);
            if (col === undefined) { col = rampColor(scheme, q / 255); fcache.set(q, col); }
          }
          ctx.fillStyle = col;
          ctx.fillRect(Math.round(midX + centerXpx(r, c) - drawW / 2), y, Math.ceil(drawW), px);
        }
      }
    } else {
      const isoSet = isoSetE;
      const cache = new Map();
      for (let r = off; r < N; r++) {
        const rowStart = (r * (r + 1)) / 2;
        const y = (r - off) * px;
        const cTo = halfCTo(r, half);
        for (let c = halfCFrom(r, half); c <= cTo; c++) {
          const v = tri[rowStart + c];
          let col = cache.get(v);
          if (col === undefined) { col = residueColor(v, modVal, scheme, isoSet); cache.set(v, col); }
          if (col === BG) continue;
          ctx.fillStyle = col;
          ctx.fillRect(Math.round(midX + centerXpx(r, c) - drawW / 2), y, Math.ceil(drawW), px);
        }
      }
    }
    // advance the temporal history for the next frame — but only the streams the
    // active maps actually consume (snapshots are ~4–8MB each at large row counts)
    if (mapCtx) {
      const ids = mapCtx.activeIds;
      const needPrev = ids.includes('temporal') || ids.includes('colorflow');
      const needHist = ids.includes('magnify');
      const needField = ids.includes('average') && mapCtx.P.avgMode === 'temporal';
      const total = (N * (N + 1)) / 2;
      if (needPrev) mapCtx.prev = { residues: tri.slice(0) };
      if (needHist) {
        if (mapCtx.hist && mapCtx.hist.size === total) {
          mapCtx.hist.frames.push(tri.slice(0));
          while (mapCtx.hist.frames.length > 64) mapCtx.hist.frames.shift();
        } else {
          mapCtx.hist = { size: total, frames: [tri.slice(0)] };
        }
      }
      if (ids.includes('census')) {
        let cs = mapCtx.census;
        if (!cs || cs.size !== total || !cs.sum) { cs = { size: total, sum: new Float32Array(total), count: 0 }; mapCtx.census = cs; }
        const sm = cs.sum;
        for (let i = 0; i < total; i++) if (tri[i] === 0) sm[i] += 1;
        cs.count++;
      }
      if (ids.includes('trail')) {
        const tk = `${mapCtx.P.trailTarget}|${mapCtx.P.trailWidth}|${mapCtx.P.trailLen}`;
        const prevE = (mapCtx.trail && mapCtx.trail.size === total && mapCtx.trail.e) ? mapCtx.trail.e : null;
        mapCtx.trail = { size: total, prev: prevE, e: trailStep(tri, m, mapCtx.P, prevE), tri, key: tk };
      }
      if (ids.includes('afterimage')) {
        const { atk, dec } = afterimageParams(mapCtx.P);
        if (mapCtx.colorMode === 'palette' && planes && planes.adaptIn) {
          const A = (mapCtx.adaptColor && mapCtx.adaptColor.size === total) ? mapCtx.adaptColor : null;
          mapCtx.adaptColor = {
            size: total,
            r: adaptStep(planes.adaptIn.r, A ? A.r : null, atk, dec),
            g: adaptStep(planes.adaptIn.g, A ? A.g : null, atk, dec),
            b: adaptStep(planes.adaptIn.b, A ? A.b : null, atk, dec),
          };
        } else if (fieldInfo && fieldInfo.adaptIn) {
          const A = (mapCtx.adapt && mapCtx.adapt.size === total) ? mapCtx.adapt.s : null;
          mapCtx.adapt = { size: total, s: adaptStep(fieldInfo.adaptIn, A, atk, dec) };
        }
      }
      const needColorHist = mapCtx.colorMode === 'palette' && ids.includes('average') && mapCtx.P.avgMode === 'temporal' && planes && planes.pre;
      if (needColorHist) {
        const pre = planes.pre;
        const frame = new Uint8ClampedArray(total * 3);
        for (let i = 0; i < total; i++) { frame[i * 3] = pre.r[i] * 255; frame[i * 3 + 1] = pre.g[i] * 255; frame[i * 3 + 2] = pre.b[i] * 255; }
        if (mapCtx.colorHist && mapCtx.colorHist.size === total) {
          mapCtx.colorHist.frames.push(frame);
          while (mapCtx.colorHist.frames.length > 64) mapCtx.colorHist.frames.shift();
        } else {
          mapCtx.colorHist = { size: total, frames: [frame] };
        }
      }
      const under = needField && fieldInfo ? fieldInfo.under : null;
      if (under) {
        if (mapCtx.fieldHist && mapCtx.fieldHist.size === total) {
          mapCtx.fieldHist.frames.push(under.slice(0));
          while (mapCtx.fieldHist.frames.length > 64) mapCtx.fieldHist.frames.shift();
        } else {
          mapCtx.fieldHist = { size: total, frames: [under.slice(0)] };
        }
      }
    }
    return cv;
  };

  // Resolve how many rows a frame at `modVal` should have, honoring the row mode.
  // 'match' mirrors the live preview: rows = mod if LINKED, else the current size.
  const rowsForMod = (modVal, mode, fixedRows) => {
    if (mode === 'track') return modVal;
    if (mode === 'fixed') return Math.max(2, fixedRows);
    // 'match' — what you see in the preview (linked rows honor the link cap)
    return isPaired ? linkedRows(modVal) : size;
  };

  // ---- One plan for an export ----
  // The frame list, the uniform canvas size and the mode label were each derived twice:
  // once by the console's size readout and again inside runExport, with slightly
  // different clamps — so the readout could promise a size the export did not produce.
  // Both now read this.
  const exportPlan = useMemo(() => {
    const start = clampMod(parseInt(expStartMod, 10) || 2);
    const end = clampMod(parseInt(expEndMod, 10) || 2);
    const px = Math.max(1, Math.min(20, parseInt(expPxPerCell, 10) || 1));
    const fixedRows = Math.max(2, Math.min(MAX_SIZE, parseInt(expFixedRows, 10) || 128));
    const tz = parseInt(zScale3d, 10);
    const zRows = Math.max(0, Math.min(200, Number.isFinite(tz) ? tz : 40));
    const ms = parseInt(meshStep, 10);
    const mesh = Math.max(0, Math.min(64, Number.isFinite(ms) ? ms : 0));
    const mods = exportModList(start, end, { modMode, intervalSeq, intervalN });
    // Measure with the same geometry the renderer draws with, over every frame — the 3D
    // views carry the Z extrusion in their height, and a focused half in EQUILATERAL
    // layout is wider per cell than the row count alone suggests.
    let dimW = 0, dimH = 0;
    for (const mv of mods) {
      const rows = rowsForMod(mv, expRowMode, fixedRows);
      const rowOff = followMod ? followStart(mv, followPctC, Math.max(2, rows)) : rowStart;
      const g = frameGeom({ rows, rowOff, px, half: halfMode, layout: halfLayout, view: viewMode, zRows });
      if (g.w > dimW) dimW = g.w;
      if (g.h > dimH) dimH = g.h;
    }
    return { start, end, px, fixedRows, zRows, mesh, mods, dimW, dimH,
      label: modeLabel(modMode, intervalSeq, intervalN),
      tag: modeTag(modMode, intervalSeq, intervalN) };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [expStartMod, expEndMod, expPxPerCell, expFixedRows, expRowMode, modMode, intervalSeq,
      intervalN, halfMode, halfLayout, viewMode, zScale3d, meshStep, followMod, followPctC,
      rowStart, isPaired, size, linkCap]);

  // Compose a native triangle canvas onto the output for a given fit mode.
  // dimW/dimH allow a rectangular uniform canvas (needed for windowed/offset frames).
  const composeFrame = (native, dimW, dimH, fit, frameCanvas) => {
    if (fit === 'tight') return native; // PNG is exactly the (possibly trapezoidal) native size
    const ctx = frameCanvas.getContext('2d');
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, dimW, dimH);
    ctx.imageSmoothingEnabled = false;
    if (fit === 'stretch') {
      ctx.drawImage(native, 0, 0, native.width, native.height, 0, 0, dimW, dimH); // fill edge-to-edge
    } else { // centered
      const offX = Math.floor((dimW - native.width) / 2);
      const offY = Math.floor((dimH - native.height) / 2);
      ctx.drawImage(native, offX, offY);
    }
    return frameCanvas;
  };

  const runExport = async () => {
    if (expBusy) return;
    const { start, end, px, fixedRows, zRows, mesh, mods, dimW, dimH } = exportPlan;
    if (mods.length === 0) { setExpStatus('No mods match the active mode in that range.'); return; }
    if (Math.max(dimW, dimH) > 8000) { setExpStatus(`Frame would be ${dimW}×${dimH}px — too large. Lower the end mod or px/cell.`); return; }
    if (mods.length > 2000) { setExpStatus(`${mods.length} frames is too many. Narrow the range.`); return; }

    setExpBusy(true);
    setExpProgress(0);
    const fitLabel = expFit === 'tight' ? 'tight-cropped' : expFit === 'stretch' ? `stretched ${dimW}×${dimH}` : `centered ${dimW}×${dimH}`;
    setExpStatus(`Rendering ${mods.length} frames (${fitLabel})...`);
    try {
      const JSZip = await loadJSZip();
      const zip = new JSZip();
      const frameCanvas = document.createElement('canvas');
      frameCanvas.width = dimW; frameCanvas.height = dimH;
      const pad = String(mods.length - 1).length; // index 0..(count-1)

      // map context replays across the sweep so temporal maps (flow/magnify/avg) build up
      const mapCtx = [...activeMaps].some((id) => id !== 'value') ? {
        activeIds: [...activeMaps],
        colorMode: mapColorMode,
        colorHist: null,
        trail: null,
        adapt: null,
        adaptColor: null,
        blendMode,
        P,
        hist: null,
        prev: null,
        fieldHist: null,
        census: null,
      } : null;

      for (let i = 0; i < mods.length; i++) {
        const mv = mods[i];
        const rows = rowsForMod(mv, expRowMode, fixedRows);
        const rowOff = followMod ? followStart(mv, followPctC, Math.max(2, rows)) : rowStart;
        const native = renderTriangleNative({
          modVal: mv, rows, px, scheme: colorScheme, isoInput: isolateInput, mapCtx,
          rowOff, half: halfMode, layout: halfLayout, view: viewMode, zRows, mesh,
        });
        const outCanvas = composeFrame(native, dimW, dimH, expFit, frameCanvas);
        const blob = await new Promise((res) => outCanvas.toBlob(res, 'image/png'));
        if (!blob) throw new Error(`frame ${i} (mod ${mv}) failed to encode`);
        zip.file(`${String(i).padStart(pad, '0')}.png`, blob);
        setExpProgress((i + 1) / mods.length);
        if (i % 5 === 0) await new Promise((r) => setTimeout(r, 0)); // yield to UI
      }

      setExpStatus('Packaging ZIP...');
      const out = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(out);
      const a = document.createElement('a');
      a.href = url;
      // descriptive name encoding every parameter that shaped the output
      const mode = exportPlan.tag;
      const rowsTag = expRowMode === 'track' ? 'rows-eq-mod'
        : expRowMode === 'fixed' ? `rows-${fixedRows}`
        : (isPaired ? 'rows-eq-mod' : `rows-${size}`); // match preview
      const sizeTag = expFit === 'tight' ? 'tight' : `${expFit}-${dimW}x${dimH}`;
      const iso = isolateInput.trim()
        ? '_iso-' + isolateInput.trim().replace(/\s+/g, '').replace(/[^0-9n/,.-]/gi, '').replace(/,/g, '+').replace(/\//g, 'over')
        : '';
      a.download =
        `pascal_mod${start}-${end}_${mode}_${colorScheme}_${rowsTag}_${px}px_${sizeTag}_${mods.length}frames${iso}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setExpStatus(`Done — ${mods.length} frames (${expFit === 'tight' ? 'tight-cropped' : expFit + " " + dimW + "×" + dimH}).`);
    } catch (err) {
      setExpStatus(`Export failed: ${err.message}`);
    } finally {
      setExpBusy(false);
    }
  };
  const applyPreset = (p) => {
    setIsPlaying(false);
    // Clear the selection mode too. It used to only clear PRIME, so applying a preset
    // while INTERVAL or a parity filter was on immediately snapped the modulus away
    // from the one the preset asked for.
    setModMode('all');
    setPrimeSortFilter('all');
    setSize(p.size);
    setMod(p.mod);
    setIsolateInput(p.isolate || '');
    resetView();
  };

  // Only the expanded decal shows this, so skip the digit work while it is minimized.
  const hoverMath = useMemo(() => {
    if (!hoveredCell || !showAnalysis) return null;
    const { row: n, col: k } = hoveredCell;
    const p = mod;
    if (!isPrime(p)) return { prime: false };
    const L = lucas(n, k, p);
    const carries = kummerCarries(n, k, p);
    return { prime: true, p, digits: L.digits, zero: L.zero, carries };
  }, [hoveredCell, mod, showAnalysis]);

  /* ---------------- Win95 primitives (hoisted to module scope) ---------------- */



  return (
    <div style={{ background: '#008080', fontFamily: DOS_FONT }}
      className="flex h-screen w-screen overflow-hidden text-black">
      <style>{`
        @media (prefers-reduced-motion: reduce){*,::before,::after{animation:none!important;transition:none!important}}
        /* Win95 slider */
        .w95-slider{-webkit-appearance:none;appearance:none;height:20px;background:transparent;cursor:pointer}
        .w95-slider::-webkit-slider-runnable-track{height:4px;background:#808080;
          box-shadow:inset 1px 1px 0 #000, inset -1px -1px 0 #fff;border:1px solid #808080}
        .w95-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
          width:12px;height:20px;margin-top:-9px;background:#c0c0c0;
          border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #000;border-bottom:2px solid #000;
          box-shadow:inset -1px -1px 0 #808080}
        .w95-slider::-moz-range-track{height:4px;background:#808080;box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 #fff}
        .w95-slider::-moz-range-thumb{width:10px;height:18px;background:#c0c0c0;border-radius:0;
          border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #000;border-bottom:2px solid #000}
        .w95-scroll{scrollbar-width:auto}
        .w95-scroll::-webkit-scrollbar{width:16px}
        .w95-scroll::-webkit-scrollbar-track{background:#dfdfdf}
        .w95-scroll::-webkit-scrollbar-thumb{background:#c0c0c0;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #000;border-bottom:2px solid #000}
        input.w95-text{font-family:'Courier New',monospace;font-size:12px;background:#fff;color:#000;padding:2px 4px;
          border-top:2px solid #808080;border-left:2px solid #808080;border-right:2px solid #fff;border-bottom:2px solid #fff;outline:none}
      `}</style>

      {/* ===================== WINDOW FRAME ===================== */}
      <div style={{ ...RAISED, background: C.face }}
        className="m-1 flex-1 flex flex-col min-w-0 overflow-hidden">

        {/* Title bar */}
        <div className="flex items-center px-1 py-0.5 m-0.5"
          style={{ background: `linear-gradient(90deg, ${C.blue}, #1084d0)` }}>
          <span className="text-white text-[12px] font-bold tracking-wide px-1">
            PASCAL-SIEVE.EXE — MODULAR LATTICE ANALYZER
          </span>
        </div>

        {/* Body: console panel + viewport */}
        <div className="flex-1 flex min-h-0">

          {/* ---------- LEFT: instrument console ---------- */}
          <div className="w-[300px] shrink-0 flex flex-col border-r-2" style={{ borderColor: C.shadow }}>
            <div className="flex-1 min-h-0 overflow-y-auto w95-scroll px-2 pb-2" style={{ background: C.face }}>

              {/* MODULUS STATUS — the lamp, plus the factorization the maps actually
                  need. The prime/composite flag used to be reported in three places at
                  once (this lamp, a strip inside PARAMETERS, and a cell in the bottom
                  status bar); the two duplicates are gone and this one now carries the
                  factor data that KUMMER / LUCAS / CRT / MOIRÉ depend on. */}
              <Group label="MODULUS STATUS">
                <div style={{ ...SUNKEN, background: '#000' }} className="flex items-center gap-2.5 px-2 py-1.5">
                  <span
                    style={{
                      width: 16, height: 16, borderRadius: '50%', flexShrink: 0,
                      border: '1px solid #000',
                      background: isPrime(mod)
                        ? 'radial-gradient(circle at 35% 30%, #ff8a7e, #d40000 72%)'
                        : 'radial-gradient(circle at 35% 30%, #3a3a3a, #141414 72%)',
                      boxShadow: isPrime(mod)
                        ? '0 0 7px #ff2200, inset 0 0 3px #ffbba8'
                        : 'inset 1px 1px 2px #000',
                    }}
                  />
                  <div className="min-w-0 leading-tight">
                    <div className="font-mono text-[13px] tracking-wider"
                      style={{ color: isPrime(mod) ? '#ff5e5e' : '#39ff5a', textShadow: '0 0 5px currentColor' }}>
                      MOD {mod}: {isPrime(mod) ? 'PRIME' : 'COMPOSITE'}
                    </div>
                    {!isPrime(mod) && (
                      <div className="font-mono text-[10px] tracking-wider" style={{ color: '#ffb000' }}>
                        = {factorString(mod)} &nbsp;p={smallestPrimeFactor(mod)}
                      </div>
                    )}
                  </div>
                </div>
              </Group>

              {/* PARAMETERS */}
              <Group label="PARAMETERS">
                <div className="flex items-center justify-between mb-1">
                  <EditReadout label="ROWS" draft={sizeDraft} liveValue={size}
                    onDraft={setSizeDraft} onCommit={commitSizeDraft} />
                  <Btn onClick={() => setIsPaired((v) => { const on = !v; if (on) setSize(linkedRows(mod)); return on; })} active={isPaired} title="Link rows to modulus">
                    {isPaired ? 'LINKED' : 'LINK'}
                  </Btn>
                </div>
                <Slider min={2} max={MAX_SIZE} value={size} disabled={isPaired}
                  onChange={(e) => commitSize(+e.target.value)} />
                <Reveal when={isPaired}>
                  <label className="flex items-center gap-1.5 mt-1.5">
                    <span className="text-[10px] whitespace-nowrap">LINK ROW CAP</span>
                    <input className="w95-text flex-1 min-w-0" inputMode="numeric" value={linkCap}
                      onChange={(e) => setLinkCap(e.target.value.replace(/[^0-9]/g, '').slice(0, 4))} />
                  </label>
                  <Note className="mt-0.5">When linked, rows = min(mod, cap). Max {MAX_SIZE}.</Note>
                </Reveal>

                <label className="flex items-center gap-1.5 mt-1.5">
                  <span className="text-[10px] whitespace-nowrap">START ROW</span>
                  <input className="w95-text flex-1 min-w-0" inputMode="numeric" disabled={followMod}
                    value={followMod ? String(rowStart) : rowStartInput}
                    onChange={(e) => setRowStartInput(e.target.value.replace(/[^0-9]/g, '').slice(0, 4))} />
                  {rowStart > 0 && !followMod && <Btn onClick={() => setRowStartInput('0')} title="Back to row 0">CLR</Btn>}
                </label>
                <Note className="mt-0.5">
                  Draws {dispRows} rows starting at row {rowStart} (down to {fullRows - 1}); values are still computed from row 0. Up to {COMPUTE_CAP} computed rows.
                </Note>
                <div className="mt-1.5">
                  <Check checked={followMod} onChange={(v) => setFollowMod(v)} label="FOLLOW MOD" />
                </div>
                <Reveal when={followMod}>
                  <NumField label="ANCHOR (% OF MOD)" range={false} max={999}
                    value={followModPct} onChange={setFollowModPct} />
                  <Note>
                    Keeps row mod × anchor% centered as the sweep runs, so the window glides down in sync with the growing structure instead of staying pinned to the apex. 100 tracks the mod line (the first full period boundary); 50 tracks the center of the first block. Small mods clamp to the apex; following saturates at the compute ceiling (row {COMPUTE_CAP}). Exports track per frame. START ROW is driven while this is on.
                  </Note>
                </Reveal>

                <Seg label="VIEW" value={viewMode}
                  onChange={(v) => { setViewMode(v); if (v !== '2d') setHoveredCell(null); }}
                  options={[
                    ['2d', '2D', 'Flat coloring'],
                    ['relief', 'RELIEF', 'Isometric height field (solid columns)'],
                    ['lattice', 'LATTICE', 'Wireframe blanket over the height field'],
                  ]} />
                <Reveal when={viewMode !== '2d'}>
                  <div className="mt-1.5">
                    <NumField label="Z SCALE" min={0} max={200} value={zScale3d} onChange={setZScale3d} />
                  </div>
                  {viewMode === 'lattice' && (
                    <div className="mt-1.5">
                      <NumField label="MESH STEP (0 = AUTO, 1–64)" range={false} max={64}
                        value={meshStep} onChange={setMeshStep} />
                    </div>
                  )}
                  <Note>
                    Extrudes the triangle into terrain: height = the active map field (KUMMER terraces, DIST→0 basins, DENSITY mass…), or the raw residue when only VALUE is on — note residues wrap, so m−1 next to 0 is a cliff, not a real jump. Sweeps morph the landscape. LATTICE drapes a hidden-line wireframe blanket over the same terrain (MESH STEP trades resolution for speed; 0 auto-targets ~300 mesh rows). Exports match this view; hover readout and number overlay are 2D-only.
                  </Note>
                </Reveal>

                <Seg label="FOCUS HALF" value={halfMode} onChange={setHalfMode}
                  options={[
                    ['full', 'FULL', 'Whole triangle'],
                    ['left', '◣ LEFT', 'Left half only (the triangle is left-right symmetric)'],
                    ['right', 'RIGHT ◢', 'Right half only'],
                  ]} />
                <Note className="mt-0.5">
                  Since the triangle mirrors left-to-right, you can focus one half. The central spine shows in both.
                </Note>
                <Reveal when={halfMode !== 'full'}>
                  <Seg label="HALF LAYOUT" value={halfLayout} onChange={setHalfLayout}
                    options={[
                      ['equi', 'EQUILATERAL', 'Reshape the half into a perfect equilateral triangle'],
                      ['shape', 'ORIGINAL', 'Keep cells in their original triangle positions'],
                    ]} />
                  <Note className="mt-0.5">
                    EQUILATERAL centers each row so the half alone forms a perfect equilateral triangle (cells stretch 2× wide). ORIGINAL keeps the half in its place within the full triangle.
                  </Note>
                </Reveal>

                <div className="flex items-center justify-between mt-2 mb-1">
                  <EditReadout label="MOD" draft={modDraft} liveValue={mod}
                    onDraft={setModDraft} onCommit={commitModDraft} wide />
                  <div className="flex gap-0.5">
                    <Btn onClick={() => stepMod(-1, false)} disabled={mod <= 2} title="Decrement">◄</Btn>
                    <Btn onClick={() => stepMod(1, false)} disabled={mod >= MOD_CAP} title="Increment">►</Btn>
                  </div>
                </div>
                {/* swap slider in fixed slot — no reflow */}
                <div className="relative">
                  <div className={primeOnly ? 'hidden' : ''}>
                    <Slider min={2} max={MOD_CAP} value={mod}
                      onMouseDown={() => setIsPlaying(false)}
                      onChange={(e) => commitMod(+e.target.value)} />
                  </div>
                  <div className={primeOnly ? '' : 'hidden'}>
                    <Slider min={0} max={primePool.length - 1} value={Math.max(0, primePool.indexOf(mod))}
                      onMouseDown={() => setIsPlaying(false)}
                      onChange={(e) => commitMod(primePool[+e.target.value] || 2)} />
                  </div>
                </div>
              </Group>

              {/* MOD SELECTION — one group in place of three separate fieldsets
                  (PRIME MODE / PARITY / INTERVAL) that held three flags each having to
                  switch the other two off. The modes are mutually exclusive, so they are
                  now one row of choices with the chosen mode's own options underneath. */}
              <Group label="MOD SELECTION">
                <Seg cols={3} value={modMode} onChange={setModMode}
                  options={MOD_MODES.map((mv) => [mv.id, mv.label, mv.note])} />
                <Note className="mt-1.5">{(MOD_MODE[modMode] || MOD_MODE.all).note}</Note>

                <Reveal when={primeOnly}>
                  <Seg label="PRIME BANK" cols={2} value={primeSortFilter}
                    onChange={setPrimeSortFilter} options={PRIME_FILTERS} />
                  <div style={{ ...SUNKEN, background: '#000' }} className="mt-1.5 px-1.5 py-0.5 flex items-center">
                    <span className="font-mono text-[10px]" style={{ color: '#39ff5a', textShadow: '0 0 4px currentColor' }}>
                      &gt; {primePool.length} PRIMES IN BANK
                    </span>
                  </div>
                </Reveal>

                <Reveal when={intervalOn}>
                  <Seg label="SEQUENCE" cols={3} value={intervalSeq}
                    onChange={(id) => { setIntervalSeq(id); if (id === 'semi2p') setExpStartMod('4'); if (id === 'semi3p') setExpStartMod('6'); }}
                    options={INTERVAL_SEQS.map((q) => [q.id, q.label])} />

                  <div className="grid grid-cols-2 gap-1.5 mt-2">
                    <label className="flex flex-col gap-0.5">
                      <span className="text-[10px]">START MOD</span>
                      <input className="w95-text" inputMode="numeric" value={expStartMod}
                        onChange={(e) => setExpStartMod(e.target.value.replace(/[^0-9]/g, ''))} />
                    </label>
                    {/* step size only matters for the fixed sequence */}
                    <label className={`flex flex-col gap-0.5 ${intervalSeq === 'fixed' ? '' : 'opacity-40 pointer-events-none'}`}>
                      <span className="text-[10px]">STEP SIZE</span>
                      <input className="w95-text" inputMode="numeric" value={intervalStep}
                        disabled={intervalSeq !== 'fixed'}
                        onChange={(e) => setIntervalStep(e.target.value.replace(/[^0-9]/g, ''))} />
                    </label>
                  </div>

                  {/* live visited-mods preview */}
                  <div style={{ ...SUNKEN, background: '#000' }} className="mt-2 px-1.5 py-1">
                    <span className="font-mono text-[10px]" style={{ color: '#39ff5a' }}>
                      {(() => {
                        const list = exportModList(intervalAnchor, MOD_CAP, { modMode: 'interval', intervalSeq, intervalN })
                          .slice(0, 9);
                        return '> ' + list.join(', ') + (list.length >= 9 ? ', …' : '');
                      })()}
                    </span>
                  </div>
                  <Note>
                    {intervalSeq === 'fixed'
                      ? 'Constant step. START MOD is shared with the export panel.'
                      : ABSOLUTE_SEQS.has(intervalSeq)
                        ? `Lands directly on ${(INTERVAL_SEQS.find((q) => q.id === intervalSeq) || {}).label} values ≥ start. Shared with export.`
                        : `Increments follow ${(INTERVAL_SEQS.find((q) => q.id === intervalSeq) || {}).label}; 0s are skipped. Shared with export.`}
                  </Note>
                </Reveal>
              </Group>

              {/* ISOLATE */}
              <Group label="RESIDUE ISOLATION">
                <div className="flex items-center gap-1">
                  <input className="w95-text flex-1 min-w-0" value={isolateInput}
                    onChange={(e) => setIsolateInput(e.target.value)} placeholder="e.g. 1, n, n-1, 1/2" />
                  <Btn onClick={() => setIsolateInput('')} disabled={!isolateInput}>CLR</Btn>
                </div>
                <p className="text-[10px] mt-1 leading-tight">Show only listed remainders. Use <b>n</b> for top ({mod - 1}), <b>0</b> for divisibility, or a fraction like <b>1/2</b> for the middle.</p>
              </Group>

              {/* PALETTE */}
              <Group label="PALETTE">
                <div className="grid grid-cols-3 gap-0.5">
                  {COLOR_SCHEMES.map((s) => (
                    <Btn key={s.id} onClick={() => setColorScheme(s.id)} active={colorScheme === s.id} full>
                      {s.label}
                    </Btn>
                  ))}
                </div>
                <Reveal when={colorScheme === 'rainbow' && activeMaps.has('value') && activeMaps.size === 1}>
                  <p className="text-[10px] mt-2 leading-tight">0=BLACK · 1=WHITE · 2..n=RED→VIOLET</p>
                </Reveal>

                {/* Layer stack. The layer list, the blend, and the per-layer controls are
                    all generated from MAP_MODES, and only the ACTIVE layers' controls are
                    rendered — the console used to carry every layer's panel in the DOM at
                    all times, collapsed, in an order unrelated to the buttons above. */}
                <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${C.shadow}` }}>
                  <Seg label="FIELD COLOR" value={mapColorMode} onChange={setMapColorMode}
                    options={[
                      ['math', 'MATH RAMP', "Paint the combined field through the color scheme's ramp"],
                      ['palette', 'PALETTE BLEND', 'The maps process the palette image itself: transforms blend the actual colors'],
                    ]} />
                  <Note className="mt-1 mb-1.5">
                    MATH RAMP paints the field through the scheme's gradient. PALETTE BLEND runs the maps on the palette image itself: measures set each cell's brightness (lightness = field), then AVERAGE and BAND PASS process the red/green/blue channels — colors genuinely smear into their neighbours, and untouched regions keep their palette color.
                  </Note>

                  <span className="text-[10px]">MEASURES (combine any)</span>
                  <div className="grid grid-cols-3 gap-0.5 mt-0.5">
                    {MAP_MEASURES.map((mm) => (
                      <Btn key={mm.id} full active={activeMaps.has(mm.id)} title={mapTitle(mm)}
                        onClick={() => toggleMap(mm.id)}>
                        {activeMaps.has(mm.id) ? '☑ ' : '☐ '}{mm.label}
                      </Btn>
                    ))}
                  </div>

                  <span className="text-[10px] block mt-2">TRANSFORMS (run on the measures)</span>
                  <div className="grid grid-cols-3 gap-0.5 mt-0.5">
                    {MAP_TRANSFORMS.map((mm) => (
                      <Btn key={mm.id} full active={activeMaps.has(mm.id)} title={mapTitle(mm)}
                        onClick={() => toggleMap(mm.id)}>
                        {activeMaps.has(mm.id) ? '☑ ' : '☐ '}{mm.label}
                      </Btn>
                    ))}
                  </div>

                  {/* blend mode shows only when 2+ layers are combined */}
                  <Reveal when={activeMaps.size > 1}>
                    <Seg label="BLEND" cols={4} value={blendMode} onChange={setBlendMode}
                      options={[
                        ['average', 'AVG', 'Mean of layers'],
                        ['multiply', 'MUL', 'Intersection — bright only where all layers are bright'],
                        ['max', 'MAX', 'Brightest layer wins'],
                        ['screen', 'SCR', 'Union — accumulates brightness'],
                      ]} />
                  </Reveal>

                  <p className="text-[10px] mt-2 leading-tight">
                    {activeMaps.has('value') && activeMaps.size === 1 ? 'Color = residue value (default).'
                      : `${activeMaps.size} layer${activeMaps.size > 1 ? 's' : ''} active${activeMaps.size > 1 ? ', blended by ' + blendMode.toUpperCase() : ''}. ↻ marks layers that need a sweep.`}
                  </p>

                  {/* one block per ACTIVE layer, in pipeline order */}
                  {MAP_MODES.filter((mm) => activeMaps.has(mm.id)).map((mm) => (
                    <MapPanel key={mm.id} mm={mm} P={P} setP={setP} mod={mod} colorScheme={colorScheme}
                      censusN={censusN} onResetCensus={resetCensus}
                      picking={trailPicking} onTogglePick={() => setTrailPicking((v) => !v)} />
                  ))}

                  {isolateSet && !(activeMaps.has('value') && activeMaps.size === 1) && (
                    <Note>
                      Isolation is masking the map to the listed residues (others hidden). Viridis/Magma/Turbo/Cool-Warm read best here.
                    </Note>
                  )}
                </div>

                <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${C.shadow}` }}>
                  <Check checked={showNumbers} onChange={(e) => setShowNumbers(e.target.checked)} label="SHOW CELL NUMBERS" />
                  <Reveal when={showNumbers}>
                    <Seg value={numberMode} onChange={setNumberMode}
                      options={[['overlay', 'ON COLORS'], ['plain', 'NUMBERS ONLY']]} />
                    <Note>Digits appear when zoomed in enough to read.{viewMode !== '2d' && ' 2D view only.'}</Note>
                  </Reveal>
                </div>
              </Group>
              {/* SWEEP */}
              <Group label="MODULUS SWEEP">
                {/* transport row */}
                <div className="grid grid-cols-4 gap-0.5">
                  <Btn onClick={jumpToStart} title="Jump to the start mod (from the export range)">⏮ START</Btn>
                  <Btn onClick={() => { setPlayDir(-1); setIsPlaying(true); }} active={isPlaying && playDir < 0} title="Play in reverse">◄◄</Btn>
                  <Btn onClick={() => setIsPlaying((v) => !v)} active={isPlaying} title={isPlaying ? 'Pause' : 'Play'}>{isPlaying ? '❚❚' : '►'}</Btn>
                  <Btn onClick={() => { setPlayDir(1); setIsPlaying(true); }} active={isPlaying && playDir > 0} title="Play forward">►►</Btn>
                </div>
                {/* single-step row */}
                <div className="grid grid-cols-2 gap-0.5 mt-0.5">
                  <Btn onClick={() => { setIsPlaying(false); stepMod(-1, keepSizeFixed); }} title="Step back one frame">◄ STEP</Btn>
                  <Btn onClick={() => { setIsPlaying(false); stepMod(1, keepSizeFixed); }} title="Step forward one frame">STEP ►</Btn>
                </div>
                <div className="flex items-center gap-1 mt-1">
                  <Readout value={`${playSpeed}ms`} color="#ffb000" />
                  <span className="text-[10px]">{playDir < 0 ? 'REVERSE' : 'FORWARD'}{isPlaying ? ' ▶' : ''}</span>
                </div>
                <div className="mt-1"><Slider min={50} max={1000} step={50} value={playSpeed}
                  onChange={(e) => setPlaySpeed(+e.target.value)} /></div>
                <div className="mt-1 grid grid-cols-1 gap-0.5">
                  <Check checked={playLoop} onChange={(e) => setPlayLoop(e.target.checked)} label="LOOP AT RANGE ENDS" />
                </div>
                {/* Only meaningful while LINKED — with rows unlinked from the mod there is
                    no row count for the sweep to drag along, so the switch did nothing. */}
                <Reveal when={isPaired}>
                  <div className="mt-0.5">
                    <Check checked={keepSizeFixed} onChange={(e) => setKeepSizeFixed(e.target.checked)} label="HOLD ROW COUNT FIXED" />
                  </div>
                  <Note className="mt-0.5">Sweep the modulus while LINKED without letting the row count follow it.</Note>
                </Reveal>
                <Note>
                  Sweeps the export START→END range. Loop wraps at the ends; off stops at the edge.
                </Note>
                <div className="mt-1.5">
                  <NumField label="TWEEN (MS, 0 = OFF)" range={false} max={3000} value={tweenMs} onChange={setTweenMs} />
                </div>
                <Note>
                  Smooths transitions between moduli: map fields morph continuously (terrain flows in 3D); pure VALUE coloring cross-dissolves, as do row-count changes. Larger = smoother. Display-only — histories, CENSUS, hover readouts, and exports always use the true frames.
                </Note>
              </Group>

              {/* PRESETS */}
              <Group label="STORED CONFIGURATIONS">
                <div className="grid grid-cols-2 gap-0.5">
                  {PRESETS.map((p) => (
                    <Btn key={p.name} onClick={() => applyPreset(p)} full
                      style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', padding: '3px 5px' }}>
                      <span className="font-bold text-[10px]">{p.name}</span>
                      <span className="text-[9px]">{p.detail}</span>
                    </Btn>
                  ))}
                </div>
              </Group>

              {/* ANIMATION EXPORT */}
              <Group label="ANIMATION EXPORT">
                <div className="grid grid-cols-2 gap-1.5">
                  <label className="flex flex-col gap-0.5">
                    <span className="text-[10px]">START MOD</span>
                    <input className="w95-text" inputMode="numeric" value={expStartMod}
                      onChange={(e) => setExpStartMod(e.target.value.replace(/[^0-9]/g, ''))} />
                  </label>
                  <label className="flex flex-col gap-0.5">
                    <span className="text-[10px]">END MOD</span>
                    <input className="w95-text" inputMode="numeric" value={expEndMod}
                      onChange={(e) => setExpEndMod(e.target.value.replace(/[^0-9]/g, ''))} />
                  </label>
                  <label className="flex flex-col gap-0.5 col-span-2">
                    <span className="text-[10px]">PX / CELL</span>
                    <input className="w95-text" inputMode="numeric" value={expPxPerCell}
                      onChange={(e) => setExpPxPerCell(e.target.value.replace(/[^0-9]/g, ''))} />
                  </label>
                </div>

                <Seg label="ROWS" value={expRowMode} onChange={setExpRowMode}
                  options={[
                    ['match', 'MATCH', 'Use the same row count shown in the live preview'],
                    ['track', '=MOD', 'Rows equal each mod'],
                    ['fixed', 'FIXED', 'A fixed row count for every frame'],
                  ]} />
                <p className="text-[10px] mt-1 leading-tight">
                  {expRowMode === 'match'
                    ? (isPaired ? 'Mirrors preview: rows = mod (LINKED).' : `Mirrors preview: ${size} rows per frame.`)
                    : expRowMode === 'track' ? 'Each frame has rows = its mod.'
                    : 'Every frame uses the fixed row count below.'}
                </p>

                <Reveal when={expRowMode === 'fixed'}>
                  <div className="mt-1.5">
                    <NumField label="FIXED ROWS" range={false} max={MAX_SIZE}
                      value={expFixedRows} onChange={setExpFixedRows} />
                  </div>
                </Reveal>

                <Seg label="FRAME FIT" value={expFit} onChange={setExpFit}
                  options={[
                    ['center', 'CENTER', 'Uniform canvas, triangle centered with margin'],
                    ['stretch', 'STRETCH', 'Uniform canvas, every triangle scaled to fill edge-to-edge'],
                    ['tight', 'TIGHT', 'Each PNG cropped to its own triangle size'],
                  ]} />

                {/* live frame preview — straight off exportPlan, the same object
                    runExport renders from, so the promised size is the produced size */}
                <div style={{ ...SUNKEN, background: '#000' }} className="mt-2 px-1.5 py-1">
                  <span className="font-mono text-[10px]" style={{ color: '#39ff5a' }}>
                    {exportPlan.mods.length
                      ? `> ${exportPlan.mods.length} FRAMES [${exportPlan.label}] ` +
                        (expFit === 'tight' ? 'tight-cropped' : `${exportPlan.dimW}×${exportPlan.dimH}px`)
                      : `> NO ${exportPlan.label} MODS IN RANGE`}
                  </span>
                </div>

                <div className="mt-2">
                  <Btn full onClick={runExport} disabled={expBusy}>
                    {expBusy ? `EXPORTING ${Math.round(expProgress * 100)}%` : '▼ EXPORT ZIP'}
                  </Btn>
                </div>
                {expBusy && (
                  <div style={{ ...SUNKEN, background: '#000' }} className="mt-1.5 h-3 relative overflow-hidden">
                    <div style={{ width: `${expProgress * 100}%`, background: '#39ff5a', height: '100%', transition: 'width .1s' }} />
                  </div>
                )}
                {expStatus && (
                  <p className="text-[10px] mt-1 leading-tight">{expStatus}</p>
                )}
              </Group>
            </div>
          </div>

          {/* ---------- RIGHT: viewport ---------- */}
          <div className="flex-1 flex flex-col min-w-0" style={{ background: C.face }}>
            {/* viewport toolbar */}
            <div className="flex items-center gap-1 px-2 py-1 border-b-2" style={{ borderColor: C.shadow }}>
              <Btn onClick={() => setZoom((z) => Math.min(40, z * 1.25))} title="Zoom in">ZOOM +</Btn>
              <Btn onClick={() => setZoom((z) => Math.max(0.1, z / 1.25))} title="Zoom out">ZOOM −</Btn>
              <Btn onClick={resetView} title="Reset view">RESET</Btn>
              <Btn onClick={download} title="Export PNG">EXPORT</Btn>
              <div className="ml-auto"><Readout label="ZOOM" value={`${Math.round(zoom * 100)}%`} color="#ffb000" /></div>
            </div>

            {/* CRT bezel */}
            <div className="flex-1 p-1.5 min-h-0" style={{ background: C.face }}>
              <div style={{ ...SUNKEN, background: BG }} className="w-full h-full relative overflow-hidden">
                <canvas ref={canvasRef}
                  onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
                  onWheel={onWheel} onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
                  className="w-full h-full block cursor-crosshair" />

                {/* Readout overlay, framed like an instrument decal. Starts MINIMIZED so
                    the viewport is clear by default: the title bar stays as a handle (and
                    doubles as a one-line readout while collapsed), and its Win95 box
                    expands the full panel. Collapsed, hoverMath is not computed at all. */}
                <div className="absolute bottom-2 left-2 pointer-events-none"
                  style={{ ...RAISED, background: C.face, width: 232 }}>
                  <div className="flex items-center gap-1 px-1 py-0.5 pointer-events-auto cursor-pointer"
                    style={{ background: C.blue }}
                    title={showAnalysis ? 'Minimize cell analysis' : 'Expand cell analysis'}
                    onClick={() => setShowAnalysis((v) => !v)}>
                    <span className="text-[10px] font-bold text-white truncate">
                      {showAnalysis || !hoveredCell
                        ? 'CELL ANALYSIS'
                        : `C(${hoveredCell.row},${hoveredCell.col}) MOD ${mod} = ${hoveredCell.val}`}
                    </span>
                    <span style={{ ...RAISED, background: C.face, width: 15, height: 13 }}
                      className="ml-auto shrink-0 grid place-items-center text-black leading-none">
                      <span className="text-[9px] -mt-px">{showAnalysis ? '_' : '□'}</span>
                    </span>
                  </div>
                  <Reveal when={showAnalysis}>
                  <div className="p-1.5 space-y-1">
                    <div className="grid grid-cols-2 gap-1">
                      <Readout label="n" value={hoveredCell ? String(hoveredCell.row) : '---'} />
                      <Readout label="k" value={hoveredCell ? String(hoveredCell.col) : '---'} />
                    </div>
                    <Readout label={`C(n,k) MOD ${mod}`} value={hoveredCell ? String(hoveredCell.val) : '---'} color="#ff5e5e" wide />

                    {/* Lucas slot, fixed-reserve so the decal does not resize on hover */}
                    <Reveal when={!!hoverMath?.prime}>
                        <div style={{ ...SUNKEN, background: '#000' }} className="p-1 mt-0.5">
                          <p className="text-[9px] font-mono mb-0.5" style={{ color: '#39ff5a' }}>
                            LUCAS / BASE-{hoverMath?.p}
                          </p>
                          <div className="flex flex-wrap gap-0.5">
                            {hoverMath?.digits?.map((d, i) => (
                              <span key={i} className="font-mono text-[10px] px-1"
                                style={{ color: d.ki > d.ni ? '#ff5e5e' : '#39ff5a' }}>
                                ({d.ni},{d.ki})
                              </span>
                            ))}
                          </div>
                          <p className="text-[9px] font-mono mt-0.5" style={{ color: '#ffb000' }}>
                            {hoverMath?.zero ? 'VANISHES (k>n DIGIT)' : `CARRIES=${hoverMath?.carries}`}
                          </p>
                        </div>
                    </Reveal>
                  </div>
                  </Reveal>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* Status bar. Reports what is actually on screen: ROWS and CELLS used to be
            derived from the ROWS setting alone, so a START ROW offset or a row count
            clamped by the compute ceiling made both numbers wrong. The prime/composite
            cell is gone — MODULUS STATUS at the top of the console already says it, with
            the factorization. */}
        <div className="flex items-stretch gap-0.5 px-1 py-0.5" style={{ background: C.face }}>
          {[
            rowStart > 0 ? `ROWS:${dispRows}@${rowStart}` : `ROWS:${dispRows}`,
            `MOD:${mod}`,
            `RESIDUES:${distinctResidues}`,
            `MAPS:${activeMaps.size}`,
            `CELLS:${(((fullRows * (fullRows + 1)) / 2 - (rowStart * (rowStart + 1)) / 2)).toLocaleString()}`,
          ].map((t, i) => (
            <div key={i} style={{ ...SUNKEN, background: C.face }}
              className={`px-1.5 py-0.5 text-[10px] ${i === 4 ? 'ml-auto' : ''}`}>
              {t}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
