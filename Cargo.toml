[package]
name = "pascal-triangle-explorer"
version = "0.1.0"
edition = "2021"
description = "Pascal's triangle modulo m, every pixel computed on the GPU"
license = "MIT"
default-run = "pascal-triangle-explorer"

[lib]
name = "pascal"
path = "src/lib.rs"

[[bin]]
name = "pascal-triangle-explorer"
path = "src/main.rs"

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
egui-winit = "0.36.2"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.1"
log = "0.4.34"
env_logger = "0.11.11"
ab_glyph = "0.2.32"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
